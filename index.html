    return '<p class="lead">Large U.S. investors must report their U.S.-listed stocks to the SEC every quarter on <b>Form 13F</b>. PIF\'s filing shows what it actually owns in U.S. markets: a small, very concentrated slice of the fund.</p>'+
      '<div class="fin-grid"><div style="display:grid;gap:12px"><h3>PIF\'s U.S. stocks, June 30, 2026 (total '+bnx(tot)+')</h3><div class="bars">'+bars+'</div>'+
      '<p class="pnote">Figures straight from PIF\'s Form 13F, filed '+esc(fmtDate(P.filed))+'. That is about '+pct(tot/925,0)+' of PIF\'s ~$925B in assets; private stakes and non-U.S. holdings are not on a 13F. PIF\'s gaming arm, Saudi Electronic Games Holding, files separately and reported a '+bnx(P.segh.bn)+' stake in '+esc(P.segh.name)+'.</p></div>'+
      '<div style="display:grid;gap:14px">'+
        '<div class="tiles"><div class="tile"><span class="k">Largest position</span><span class="v">'+pct(mx/tot,0)+'</span><span class="s">SpaceX alone</span></div>'+
        '<div class="tile"><span class="k">Uber, 2016 to 2026</span><span class="v">'+pct(ucagr)+'/yr</span><span class="s">$'+P.uber.cost+'B grew to '+bnx(u.bn)+' ('+umoic.toFixed(2)+'x)</span></div>'+
        '<div class="tile"><span class="k">Lucid stake value</span><span class="v">'+pct(lchg,0)+'</span><span class="s">'+bnx(P.lucidEnd2024)+' at end-2024 to '+bnx(l.bn)+'</span></div></div>'+
        '<div class="callout"><b>What an analyst would flag:</b> (1) <b>Concentration risk.</b> One stock is '+pct(mx/tot,0)+' of the U.S. portfolio, so a SpaceX drawdown moves the whole book. (2) <b>Returns vs. a benchmark.</b> Uber earned about '+pct(ucagr)+' a year over ten years, well below the U.S. stock market over the same period. (3) <b>Strategic bets cost money.</b> Lucid, PIF\'s electric-car bet tied to building a Saudi auto industry, lost most of its market value, a sign that some holdings serve industrial policy more than returns.</div>'+
        '<p class="pnote">Math: money multiple = value now / amount invested. Annual return (CAGR) = multiple^(1/years) - 1. Uber\'s cost is PIF\'s $3.5B investment announced in June 2016. Lucid\'s change compares 13F market values at Dec 31, 2024 and June 30, 2026 and ignores new money PIF added.</p>'+
      '</div></div>'+srcs(P.sources);
  }
  function renderGloss(){
    var g=[['Enterprise value (EV)','The price of a whole company: its equity plus debt, minus cash. What buyers compare across deals.'],['EBITDA','Earnings before interest, taxes, depreciation and amortization. A rough measure of the cash a business produces from operations.'],['EV / EBITDA multiple','How many years of EBITDA a buyer pays. A higher multiple means a pricier deal.'],['Leverage','Debt divided by EBITDA. Higher leverage means more of the company\'s cash goes to paying lenders.'],['LBO','Leveraged buyout: buying a company mostly with borrowed money, repaying the debt with the company\'s cash, then selling it.'],['IRR','Internal rate of return: the yearly return on an investment. Buyout funds typically aim for 15% or more.'],['MOIC','Multiple on invested capital: money out divided by money in. 2.0x means you doubled your money.'],['Form 13F','A quarterly SEC filing listing the U.S.-traded stocks held by large investors, including sovereign funds.'],['Fiscal break-even oil price','The oil price a government needs to balance its budget. Below it, the state runs a deficit.'],['Concentration risk','The danger of having too much money in one position, so one loss hurts the whole portfolio.']];
    return '<p class="lead">The finance terms used on this page, in plain English.</p><div class="gloss">'+g.map(function(x){return '<div><b>'+esc(x[0])+'</b>'+esc(x[1])+'</div>';}).join('')+'</div>';
  }
  function renderFinance(){
    if (!STATE.finance) return '';
    var tabs=[['deal','Deal model: EA buyout'],['oil','Risk: oil and the Saudi budget'],['pif','PIF\'s U.S. stocks'],['gloss','Key terms']];
    var body = finUi.tab==='oil'?renderOil():finUi.tab==='pif'?renderPif():finUi.tab==='gloss'?renderGloss():renderDeal();
    return '<section class="fin" aria-labelledby="fin-h"><h2 id="fin-h">Finance desk</h2>'+
      '<p>The financial analysis behind the headlines: what a deal is worth, what could go wrong, and how the funds\' bets have performed. Every number comes from an official filing, government data or a major news outlet, or is labeled as an assumption.</p>'+
      '<div class="fin-card"><div class="tabs" role="tablist">'+tabs.map(function(x){return '<button type="button" role="tab" data-fintab="'+x[0]+'" aria-selected="'+(finUi.tab===x[0])+'">'+esc(x[1])+'</button>';}).join('')+'</div>'+body+
      '<a class="dl" href="https://raw.githubusercontent.com/xavierndavis-creator/gulf-statecraft-tracker/main/Gulf_Tracker_Finance_Workbook.xlsx" target="_blank" rel="noopener">Download the Excel model</a><span class="dlnote">Excel file with live formulas: change the blue inputs and the returns recalculate.</span></div></section>';
  }

  function renderControls(n){
    var cats = '<option value="">All categories</option>'+CATEGORIES.map(function(c){return '<option'+(ui.category===c?' selected':'')+'>'+esc(c)+'</option>';}).join('');
    return '<div class="controls">'+
      '<input id="q" type="search" placeholder="Search entries and notes" aria-label="Search" value="'+esc(ui.q)+'">'+
      '<select id="cat" aria-label="Category">'+cats+'</select>'+
      (ui.country?'<button type="button" class="btn ghost small" id="clear-country">'+esc(ui.country)+' ×</button>':'')+
      (ui.canEdit && !ui.editing ? '<button type="button" class="btn" id="add">Add entry</button>' : '')+
      '<span class="count">'+n+' shown</span>'+
    '</div>';
  }

  function renderEntry(e){
    var noteHtml = (e.note||'').trim()
      ? '<div class="note"><span class="k">Analysis</span><p>'+esc(e.note)+'</p></div>'
      : (ui.canEdit ? '<div class="note empty"><span class="k">Analysis</span><p>No analysis yet. Use Edit to add why this matters.</p></div>' : '');
    var tools = '';
    if (ui.canEdit){
      if (ui.confirmDel===e.id){
        tools = '<div class="tools"><span class="hint">Delete this entry for good?</span><button type="button" class="btn danger small" data-act="del-yes" data-id="'+esc(e.id)+'">Delete</button><button type="button" class="btn ghost small" data-act="del-no">Keep</button></div>';
      } else {
        tools = '<div class="tools"><button type="button" class="btn ghost small" data-act="edit" data-id="'+esc(e.id)+'">Edit</button><button type="button" class="btn ghost small" data-act="del" data-id="'+esc(e.id)+'">Delete</button></div>';
      }
    }
    return '<article class="entry'+(e.category==='Context'?' ctx':'')+'" id="'+esc(e.id)+'">'+
      '<div class="meta"><span class="date">'+esc(fmtDate(e.date))+'</span>'+
        e.countries.map(function(c){return '<span class="chip cty">'+esc(c)+'</span>';}).join('')+
        '<span class="chip">'+esc(e.category)+'</span>'+
        '<span class="pill '+statusClass(e.status)+'">'+esc(e.status)+'</span></div>'+
      '<div class="row"><h3>'+esc(e.title)+'</h3>'+(e.value?'<span class="value">'+esc(e.value)+'</span>':'')+'</div>'+
      '<p class="summary">'+esc(e.summary)+'</p>'+
      noteHtml+
      (e.sources&&e.sources.length?'<div class="sources">Sources: '+e.sources.map(function(s){return '<a href="'+esc(safeUrl(s.url))+'" target="_blank" rel="noopener">'+esc(s.label||s.url)+'</a>';}).join('')+'</div>':'')+
      tools+
    '</article>';
  }

  function renderTimeline(list){
    if (!list.length) return '<div class="empty-state">No entries match these filters.</div>';
    var groups=[], cur=null;
    list.forEach(function(e){ var k=monthKey(e.date); if(!cur||cur.k!==k){cur={k:k,items:[]};groups.push(cur);} cur.items.push(e); });
    return '<div class="timeline">'+groups.map(function(g){
      return '<section class="month"><div class="mlabel">'+esc(monthLabel(g.k))+'</div><div class="entries">'+g.items.map(renderEntry).join('')+'</div></section>';
    }).join('')+'</div>';
  }

  function renderEditor(){
    var e = ui.editing; if (!e) return '';
    var isNew = !STATE.entries.some(function(x){return x.id===e.id;});
    var src = (e.sources||[]).concat([{label:'',url:''},{label:'',url:''}]).slice(0,2);
    function opts(list,val){ return list.map(function(o){return '<option'+(o===val?' selected':'')+'>'+esc(o)+'</option>';}).join(''); }
    return '<form class="editor" id="editor" novalidate>'+
      '<h2>'+(isNew?'New entry':'Edit entry')+'</h2>'+
      '<div class="grid2">'+
        '<div class="field"><label for="f-date">Date</label><input id="f-date" type="date" required value="'+esc(e.date)+'"></div>'+
        '<div class="field"><label for="f-value">Headline value</label><input id="f-value" placeholder="e.g. $20B" value="'+esc(e.value)+'"></div>'+
        '<div class="field"><label for="f-bn">Chart value ($ billions)</label><input id="f-bn" type="number" step="0.1" min="0" placeholder="Leave blank to keep off the chart" value="'+(typeof e.valueBn==='number'?e.valueBn:'')+'"></div>'+
        '<div class="field"></div>'+
        '<div class="field"><label for="f-cat">Category</label><select id="f-cat">'+opts(CATEGORIES,e.category)+'</select></div>'+
        '<div class="field"><label for="f-status">Status</label><select id="f-status">'+opts(STATUSES,e.status)+'</select></div>'+
      '</div>'+
      '<fieldset class="field"><legend>Countries</legend><div class="checks">'+COUNTRIES.map(function(c,i){
        return '<label><input type="checkbox" id="f-c'+i+'" value="'+esc(c)+'"'+(e.countries.indexOf(c)>=0?' checked':'')+'> '+esc(c)+'</label>';
      }).join('')+'</div></fieldset>'+
      '<div class="field"><label for="f-title">Headline</label><input id="f-title" required value="'+esc(e.title)+'"></div>'+
      '<div class="field"><label for="f-summary">What happened (facts only)</label><textarea id="f-summary">'+esc(e.summary)+'</textarea></div>'+
      '<div class="field"><label for="f-note">Analysis: why it matters</label><textarea id="f-note" placeholder="Your read on the statecraft angle: leverage, precedent, what to watch next.">'+esc(e.note)+'</textarea></div>'+
      '<div class="grid2">'+
        '<div class="field"><label for="f-s0l">Source 1 name</label><input id="f-s0l" value="'+esc(src[0].label)+'"></div>'+
        '<div class="field"><label for="f-s0u">Source 1 link</label><input id="f-s0u" type="url" value="'+esc(src[0].url)+'"></div>'+
        '<div class="field"><label for="f-s1l">Source 2 name</label><input id="f-s1l" value="'+esc(src[1].label)+'"></div>'+
        '<div class="field"><label for="f-s1u">Source 2 link</label><input id="f-s1u" type="url" value="'+esc(src[1].url)+'"></div>'+
      '</div>'+
      (ui.msg?'<div class="msg" role="status">'+esc(ui.msg)+'</div>':'')+
      '<div class="tools"><button class="btn" type="submit"'+(ui.busy?' disabled':'')+'>'+(ui.busy?'Saving…':'Save and publish')+'</button><button class="btn ghost" type="button" id="cancel">Cancel</button></div>'+
      '<p class="hint">Saving publishes a new version of this page for everyone who has the link.</p>'+
    '</form>';
  }

  function render(){
    var list = filtered();
    var focusId = document.activeElement && document.activeElement.id;
    document.getElementById('app').innerHTML =
      '<div class="wrap">'+
        '<header class="mast">'+
          '<span class="eyebrow">Economic statecraft · U.S.-Gulf</span>'+
          '<h1>Gulf Statecraft Tracker</h1>'+
          '<p class="lede">A running record of how capital, technology access and arms sales move between Washington and the Gulf monarchies: sovereign wealth fund deals, investment pledges, export-control decisions and the policy moves around them.</p>'+
          '<div class="byline"><span>Maintained by <strong>Xavier Davis</strong></span><span>School of International Service, American University</span><span>Last updated '+esc(fmtDate(STATE.updated))+'</span></div>'+
        '</header>'+
        renderStrip()+
        renderLedger()+
        renderMoney()+
        renderPie()+
        renderFinance()+
        renderEditor()+
        renderControls(list.length)+
        renderTimeline(list)+
        '<footer class="about">'+
          '<div><h4>What counts</h4><p>Government-to-government pledges, sovereign wealth fund transactions touching the U.S., export-control and CFIUS/FCC decisions, and major arms sales involving Saudi Arabia, the UAE and Qatar.</p></div>'+
          '<div><h4>Reading the figures</h4><p>Values are headline figures as announced. Pledges are not disbursements, and many multi-year commitments overlap with deals counted elsewhere.</p></div>'+
          '<div><h4>Status key</h4><p>Proposed or Announced: stated, not binding. Signed, Approved or Adopted: formally agreed or cleared. Completed: the transaction closed.</p></div>'+
        '</footer>'+
      '</div>';
    if (focusId){ var el=document.getElementById(focusId); if(el){ el.focus(); if(el.id==='q'){ try{ el.setSelectionRange(el.value.length,el.value.length);}catch(_){} } } }
  }

  function readForm(){
    var e = ui.editing;
    var g = function(id){ var el=document.getElementById(id); return el?el.value.trim():''; };
    var countries = COUNTRIES.filter(function(c,i){ var el=document.getElementById('f-c'+i); return el&&el.checked; });
    var sources = [[g('f-s0l'),g('f-s0u')],[g('f-s1l'),g('f-s1u')]].filter(function(s){return s[1];}).map(function(s){return {label:s[0]||s[1].replace(/^https?:\/\/(www\.)?/,'').split('/')[0], url:s[1]};});
    return { id:e.id, date:g('f-date'), countries:countries, category:g('f-cat'), status:g('f-status'), title:g('f-title'), summary:g('f-summary'), value:g('f-value'), sources:sources, note:(document.getElementById('f-note')||{}).value||'', valueBn:(function(v){ var n=parseFloat(v); return isFinite(n)&&n>0?n:null; })(g('f-bn')) };
  }

  function todayISO(){ var d=new Date(); var m=d.getMonth()+1, dd=d.getDate(); return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(dd<10?'0':'')+dd; }

  function buildDoc(state){
    var json = JSON.stringify(state).replace(/</g,'\\u003c');
    var css = document.getElementById('app-style').textContent;
    var js = document.getElementById('app-js').textContent;
    var fonts = document.getElementById('app-fonts').getAttribute('href');
    var S='scr'+'ipt';
    return '<!doctype html>\n<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">'+
      '<title>Gulf Statecraft Tracker</title>'+
      '<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>'+
      '<link id="app-fonts" rel="stylesheet" href="'+fonts.replace(/&/g,'&amp;')+'">'+
      '<style id="app-style">'+css+'</style></head><body><div id="app"></div>'+
      '<'+S+' id="tracker-data" type="application/json">'+json+'</'+S+'>'+
      '<'+S+' id="app-js">'+js+'</'+S+'></body></html>';
  }

  function save(next){
    if (!artifactNs){ ui.msg='Saving is not available in this view.'; render(); return; }
    ui.busy=true; ui.msg=''; render();
    artifactNs.publish(buildDoc(next)).then(function(){ /* the view reloads to the new version */ }, function(err){
      ui.busy=false;
      var code = err && err.code;
      if (code==='conflict'){ ui.msg='A newer version was just published. The page is reloading to it.'; }
      else if (code==='not_writer'||code==='not_granted'||code==='not_declared'||code==='capability_disabled'||code==='consent_required'){ ui.canEdit=false; ui.editing=null; ui.confirmDel=null; ui.msg=''; }
      else if (code==='rate_limited'){ ui.msg='Too many saves in a row. Wait a minute and try again.'; }
      else { ui.msg='The save did not go through. Try again in a moment.'; }
      render();
    });
  }

  document.addEventListener('input', function(ev){
    if (ev.target.id==='q'){ ui.q=ev.target.value; render(); }
  });
  document.addEventListener('change', function(ev){
    if (ev.target.id==='cat'){ ui.category=ev.target.value; render(); }
  });
  document.addEventListener('submit', function(ev){
    if (ev.target.id!=='editor') return;
    ev.preventDefault();
    var e = readForm();
    if (!/^\d{4}-\d{2}-\d{2}$/.test(e.date)){ ui.editing=e; ui.msg='Add a date.'; render(); return; }
    if (!e.title){ ui.editing=e; ui.msg='Add a headline.'; render(); return; }
    if (!e.countries.length){ ui.editing=e; ui.msg='Pick at least one country.'; render(); return; }
    var entries = STATE.entries.filter(function(x){return x.id!==e.id;}).concat([e]);
    save({ updated: todayISO(), benchmarks: STATE.benchmarks||[], entries: entries });
  });

  var tipEl = null;
  function showTip(row){
    if (!tipEl){ tipEl=document.createElement('div'); tipEl.className='tip'; tipEl.setAttribute('role','tooltip'); document.body.appendChild(tipEl); }
    tipEl.innerHTML = row.getAttribute('data-tip'); tipEl.hidden=false;
    var bar=((row.querySelector&&row.querySelector('.bar'))||row).getBoundingClientRect();
    var x=Math.min(bar.right+8, window.innerWidth-tipEl.offsetWidth-12), y=bar.top-tipEl.offsetHeight-8;
    if (y<8) y=bar.bottom+8;
    tipEl.style.left=Math.max(8,x)+'px'; tipEl.style.top=y+'px';
  }
  function hideTip(){ if(tipEl) tipEl.hidden=true; }

  document.addEventListener('click', function(ev){
    var p=ev.target.closest&&ev.target.closest('[data-pie]');
    if (p && !p.disabled){ var k=p.getAttribute('data-pie'); pieUi.sel = pieUi.sel===k ? null : k; hideTip(); render(); return; }
    if (ev.target.id==='pv-deals'){ pieUi.view='deals'; pieUi.sel=null; render(); return; }
    if (ev.target.id==='pv-pledges'){ pieUi.view='pledges'; pieUi.sel=null; render(); return; }
    if (ev.target.id==='pv-funds'){ pieUi.view='funds'; pieUi.sel=null; render(); return; }
  });
  document.addEventListener('change', function(ev){ if (ev.target.id==='pv-arms'){ pieUi.arms=ev.target.checked; pieUi.sel=null; render(); } });
  document.addEventListener('keydown', function(ev){ var p=ev.target.closest&&ev.target.closest('.donut path'); if(p&&(ev.key==='Enter'||ev.key===' ')){ ev.preventDefault(); p.dispatchEvent(new MouseEvent('click',{bubbles:true})); } });

  function eaRefresh(){ var sy=window.scrollY; render(); window.scrollTo(0,sy); }
  document.addEventListener('input', function(ev){
    var id=ev.target.id; if(!finUi.ea) return;
    if (id==='ea-exit'){ finUi.ea.exit=+ev.target.value; eaRefresh(); var el=document.getElementById('ea-exit'); if(el) el.focus(); }
    else if (id==='ea-growth'){ finUi.ea.growth=+ev.target.value; eaRefresh(); var el2=document.getElementById('ea-growth'); if(el2) el2.focus(); }
    else if (id==='ea-rate'){ finUi.ea.rate=+ev.target.value; eaRefresh(); var el3=document.getElementById('ea-rate'); if(el3) el3.focus(); }
  });
  document.addEventListener('change', function(ev){ if (ev.target.id==='ea-sav'){ finUi.ea.useSavings=ev.target.checked; eaRefresh(); } });
  document.addEventListener('click', function(ev){
    var tb=ev.target.closest&&ev.target.closest('[data-fintab]'); if(tb){ finUi.tab=tb.getAttribute('data-fintab'); hideTip(); eaRefresh(); return; }
    if (ev.target.id==='ea-reset'){ finUi.ea=null; eaRefresh(); }
  });
  document.addEventListener('mouseover', function(ev){ var r=ev.target.closest&&ev.target.closest('.bar-row,.donut path,.oilchart .hit'); if(r) showTip(r); else hideTip(); });
  document.addEventListener('focusin', function(ev){ var r=ev.target.closest&&ev.target.closest('.bar-row,.donut path,.oilchart .hit'); if(r) showTip(r); else hideTip(); });
  document.addEventListener('scroll', hideTip, {passive:true});
  document.addEventListener('click', function(ev){
    var t = ev.target.closest('button'); if (!t) return;
    if (t.hasAttribute('data-goto')){ var id=t.getAttribute('data-goto'); ui.country=''; ui.category=''; ui.q=''; render(); var el=document.getElementById(id); if(el){ el.scrollIntoView({behavior:'smooth',block:'center'}); el.style.borderColor='var(--accent)'; setTimeout(function(){el.style.borderColor='';},1600);} hideTip(); return; }
    if (t.classList.contains('lane')){ var c=t.getAttribute('data-country'); ui.country = ui.country===c ? '' : c; render(); return; }
    if (t.id==='clear-country'){ ui.country=''; render(); return; }
    if (t.id==='add'){ ui.editing={ id:'e'+Date.now().toString(36), date:todayISO(), countries:[], category:CATEGORIES[0], status:'Announced', title:'', summary:'', value:'', valueBn:null, sources:[], note:'' }; ui.msg=''; render(); var f=document.getElementById('f-title'); if(f) f.focus(); return; }
    if (t.id==='cancel'){ ui.editing=null; ui.msg=''; render(); return; }
    var act = t.getAttribute('data-act'), id = t.getAttribute('data-id');
    if (act==='edit'){ var found=STATE.entries.filter(function(x){return x.id===id;})[0]; if(found){ ui.editing=JSON.parse(JSON.stringify(found)); ui.msg=''; render(); window.scrollTo({top:document.getElementById('editor').offsetTop-20,behavior:'smooth'}); } return; }
    if (act==='del'){ ui.confirmDel=id; render(); return; }
    if (act==='del-no'){ ui.confirmDel=null; render(); return; }
    if (act==='del-yes'){ save({ updated: todayISO(), benchmarks: STATE.benchmarks||[], entries: STATE.entries.filter(function(x){return x.id!==id;}) }); return; }
  });

  render();

  if (window.claude && typeof window.claude.use==='function'){
    Promise.all([window.claude.use('artifact'), window.claude.use('user')]).then(function(r){
      artifactNs = r[0]; var user = r[1];
      if (!artifactNs || !user) return;
      return user.canEdit().then(function(ok){ if (ok){ ui.canEdit=true; render(); } });
    }).catch(function(){});
  }
})();
</script>
