<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A sourced timeline of Gulf sovereign investment, U.S.-GCC deals, export-control decisions and arms sales, maintained by Xavier Davis.">
<title>Gulf Statecraft Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="app-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style id="app-style">
:root{
  --bg:#EDF1EF; --surface:#F8FAF9; --ink:#15241F; --muted:#56655F; --line:#CBD5D0;
  --accent:#0E6B5C; --accent-soft:#D5E8E2; --amber:#9A5B0C; --amber-soft:#F3E4CC;
  --ok:#2F6B34; --ok-soft:#DDEBD9; --warn:#8A5A00; --info:#2D4F7C; --info-soft:#DCE5F1;
  --grey-soft:#E1E6E3; --c-pledge:#B07A2A; --c-fund:#138A74; --grid:#DCE3E0; --c-sa:#1baf7a; --c-qa:#eb6834; --c-ae:#2a78d6;
  --serif:"Spectral", Georgia, "Times New Roman", serif;
  --sans:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1614; --surface:#15201D; --ink:#E3EBE8; --muted:#9AABA4; --line:#2A3834;
    --accent:#5CC4AA; --accent-soft:#16332C; --amber:#E0A857; --amber-soft:#3A2B14;
    --ok:#8CC98F; --ok-soft:#1C3220; --info:#9DB9E0; --info-soft:#1C2A3D; --grey-soft:#222E2B; --c-pledge:#B5802E; --c-fund:#3FA88E; --grid:#24312D; --c-sa:#199e70; --c-qa:#d95926; --c-ae:#3987e5;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1614; --surface:#15201D; --ink:#E3EBE8; --muted:#9AABA4; --line:#2A3834;
  --accent:#5CC4AA; --accent-soft:#16332C; --amber:#E0A857; --amber-soft:#3A2B14;
  --ok:#8CC98F; --ok-soft:#1C3220; --info:#9DB9E0; --info-soft:#1C2A3D; --grey-soft:#222E2B; --c-pledge:#B5802E; --c-fund:#3FA88E; --grid:#24312D; --c-sa:#199e70; --c-qa:#d95926; --c-ae:#3987e5;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding-inline:20px;padding-block:32px 64px}
@media (max-width:480px){.wrap{padding-inline:16px;padding-block:20px 48px}}

/* Masthead */
.mast{display:grid;gap:18px;padding-bottom:24px;border-bottom:1px solid var(--line)}
.eyebrow{font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
h1{font:600 clamp(30px,5vw,44px)/1.1 var(--serif);margin:0;text-wrap:balance;letter-spacing:-.01em}
.lede{max-width:66ch;margin:0;color:var(--muted);font-size:16px}
.byline{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 16px}
.byline strong{color:var(--ink);font-weight:600}

/* Summary strip */
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-top:24px}
.stat{background:var(--surface);padding:14px 16px;display:grid;gap:4px}
.stat .k{font:500 11px/1.2 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.stat .v{font:600 24px/1.1 var(--serif);font-variant-numeric:tabular-nums}
.stat .s{font-size:12px;color:var(--muted)}
@media (max-width:720px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Country ledger */
.ledger{margin-top:28px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:720px){.ledger{grid-template-columns:repeat(2,minmax(0,1fr))}}
.lane{background:var(--surface);border:1px solid var(--line);padding:12px 14px;display:grid;gap:8px;cursor:pointer;text-align:left;color:inherit;font:inherit}
.lane:hover{border-color:var(--accent)}
.lane[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.lane .name{font-weight:600;display:flex;justify-content:space-between;gap:8px}
.lane .name span{font:500 12px var(--mono);color:var(--muted)}
.ticks{display:flex;flex-wrap:wrap;gap:3px;min-height:10px}
.tick{width:10px;height:10px;background:var(--accent)}
.tick.t-ctx{background:var(--line)}
.lane .last{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Controls */
.controls{margin-top:28px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.controls input,.controls select{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);padding:8px 10px;min-width:0}
.controls input{flex:1 1 220px}
.controls select{flex:0 1 220px}
.count{font:500 12px var(--mono);color:var(--muted);margin-left:auto}
.btn{font:600 14px var(--sans);border:1px solid var(--accent);background:var(--accent);color:var(--surface);padding:8px 14px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{border-color:#A33;background:#A33;color:#fff}
.btn.small{font-size:12px;padding:4px 10px}
.btn:disabled{opacity:.5;cursor:default}

/* Timeline */
.timeline{margin-top:20px;display:grid;gap:28px}
.month{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px}
@media (max-width:640px){.month{grid-template-columns:1fr;gap:8px}}
.mlabel{font:500 13px/1.3 var(--mono);color:var(--muted);letter-spacing:.04em;text-transform:uppercase;padding-top:14px;position:sticky;top:env(safe-area-inset-top,0px);align-self:start}
@media (max-width:640px){.mlabel{position:static;padding-top:0;border-bottom:1px solid var(--line);padding-bottom:6px}}
.entries{display:grid;gap:12px}
.entry{background:var(--surface);border:1px solid var(--line);padding:16px 18px;display:grid;gap:10px}
.entry.ctx{background:transparent;border-style:dashed}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px}
.date{font:500 12px var(--mono);color:var(--muted);margin-right:4px;font-variant-numeric:tabular-nums}
.chip{font:500 11px/1 var(--mono);letter-spacing:.04em;padding:5px 7px;border:1px solid var(--line);color:var(--muted);text-transform:uppercase}
.chip.cty{color:var(--ink)}
.pill{font:600 11px/1 var(--sans);padding:5px 8px;border-radius:999px}
.st-Announced,.st-Proposed{background:var(--amber-soft);color:var(--amber)}
.st-Signed,.st-Adopted,.st-Approved{background:var(--info-soft);color:var(--info)}
.st-Completed{background:var(--ok-soft);color:var(--ok)}
.st-Ongoing,.st-other{background:var(--grey-soft);color:var(--muted)}
.entry h3{font:600 19px/1.3 var(--serif);margin:0;text-wrap:balance}
.row{display:flex;justify-content:space-between;gap:16px;align-items:baseline;flex-wrap:wrap}
.value{font:500 13px var(--mono);color:var(--accent);white-space:nowrap}
.summary{margin:0;max-width:72ch}
.sources{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.sources a{text-underline-offset:2px}
.note{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px;display:grid;gap:4px}
.note .k{font:500 11px/1 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
.note p{margin:0;white-space:pre-wrap}
.note.empty{background:transparent;border-left-color:var(--line)}
.note.empty p{color:var(--muted);font-style:italic}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.empty-state{padding:32px;text-align:center;color:var(--muted);border:1px dashed var(--line)}

/* Editor */
.editor{margin-top:20px;background:var(--surface);border:1px solid var(--accent);padding:18px;display:grid;gap:14px}
.editor h2{font:600 20px var(--serif);margin:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
.field{display:grid;gap:4px;min-width:0}
.field label,.field legend{font:500 12px var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);padding:8px 10px;width:100%}
.field textarea{min-height:84px;resize:vertical}
fieldset.field{border:0;padding:0;margin:0}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px}
.hint{font-size:12px;color:var(--muted)}
.msg{font-size:13px;color:var(--amber)}

/* Finance desk */
.fin{margin-top:36px;display:grid;gap:14px}
.fin>h2{font:600 24px/1.2 var(--serif);margin:0}
.fin>p{margin:0;color:var(--muted);max-width:72ch}
.fin-card{background:var(--surface);border:1px solid var(--line);padding:18px;display:grid;gap:16px}
.tabs{display:flex;flex-wrap:wrap;gap:0;border-bottom:1px solid var(--line)}
.tabs button{font:600 13px var(--sans);background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:8px 12px;cursor:pointer;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.fin-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:22px;align-items:start}
.fin-grid>div{min-width:0}
.tscroll{overflow-x:auto;max-width:100%}
.fin-card{min-width:0}
.dlnote{font-size:12px;color:var(--muted)}
@media (max-width:820px){.fin-grid{grid-template-columns:1fr}}
.fin h3{font:600 17px/1.3 var(--serif);margin:0}
.fin .lead{margin:0;font-size:14px;max-width:70ch}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;font-size:14px}
.kv .n{font:500 13px var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.kv .sep{grid-column:1/-1;border-top:1px solid var(--line);margin:4px 0}
.kv .tot{font-weight:600}
.slider{display:grid;gap:4px}
.slider label{display:flex;justify-content:space-between;gap:10px;font-size:13px}
.slider label span.n{font:500 13px var(--mono)}
.slider input[type=range]{width:100%;accent-color:var(--accent)}
.sliders{display:grid;gap:12px}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
@media (max-width:480px){.tiles{grid-template-columns:1fr}}
.tile{background:var(--surface);padding:12px 14px;display:grid;gap:2px}
.tile .k{font:500 11px/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tile .v{font:600 22px/1.1 var(--serif);font-variant-numeric:tabular-nums}
.tile .s{font-size:12px;color:var(--muted)}
.callout{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px;font-size:14px}
.callout b{font-weight:600}
.fin table.mini{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
.fin table.mini th,.fin table.mini td{padding:5px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.fin table.mini th:first-child,.fin table.mini td:first-child{text-align:left}
.fin table.mini th{font:500 11px var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.fin table.mini tr.hl td{background:var(--accent-soft);font-weight:600}
.srcs{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.srcs a{color:var(--accent)}
.dl{display:inline-flex;align-items:center;gap:8px;font:600 14px var(--sans);color:var(--surface);background:var(--accent);padding:9px 14px;text-decoration:none;justify-self:start}
.oilchart{width:100%;height:auto;display:block}
.oilchart .ax{font:400 11px var(--mono);fill:var(--muted)}
.oilchart .gl{stroke:var(--grid);stroke-width:1}
.oilchart .ln{fill:none;stroke:var(--c-fund);stroke-width:2;stroke-linejoin:round}
.oilchart .dot{fill:var(--c-fund);stroke:var(--surface);stroke-width:2}
.oilchart .be{stroke:var(--c-pledge);stroke-width:1.5}
.oilchart .be2{stroke:var(--c-pledge);stroke-width:1.5;stroke-dasharray:5 4}
.oilchart .bl{font:600 11px var(--sans);fill:var(--ink)}
.oilchart .hit{fill:transparent;cursor:default}
.gloss{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 22px}
@media (max-width:720px){.gloss{grid-template-columns:1fr}}
.gloss div{font-size:14px}
.gloss b{font-weight:600;display:block;font-family:var(--serif);font-size:15px}

/* Where the money comes from */
.pie{margin-top:36px;display:grid;gap:14px}
.pie>h2{font:600 24px/1.2 var(--serif);margin:0}
.pie>p{margin:0;color:var(--muted);max-width:70ch}
.pie-card{background:var(--surface);border:1px solid var(--line);padding:18px;display:grid;gap:16px}
.pie-bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line)}
.seg button{font:500 13px var(--sans);background:transparent;color:var(--muted);border:0;padding:7px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--surface)}
.chk{font-size:13px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.pie-body{display:grid;grid-template-columns:minmax(220px,340px) minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:720px){.pie-body{grid-template-columns:1fr}}
.donut{width:100%;max-width:300px;justify-self:center;display:block}
.donut path{cursor:pointer;stroke:var(--surface);stroke-width:2;transition:opacity .15s}
.donut path:focus-visible{outline:none;stroke:var(--ink);stroke-width:3}
.donut.has-sel path{opacity:.35}.donut.has-sel path.sel{opacity:1}
.donut .c-big{font:600 26px var(--serif);fill:var(--ink)}
.donut .c-small{font:500 11px var(--mono);fill:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.pie-side{display:grid;gap:14px;min-width:0}
.plegend{display:grid;gap:6px}
.plegend button{display:grid;grid-template-columns:14px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;font:inherit;font-size:14px;color:var(--ink);background:transparent;border:1px solid transparent;padding:6px 8px;cursor:pointer}
.plegend button:hover{border-color:var(--line)}
.plegend button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.plegend .v{font:500 13px var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}
.plegend .z{color:var(--muted)}
.sw14{width:14px;height:14px;border-radius:3px;display:inline-block}
.pdetail{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:8px}
.pdetail h4{margin:0;font:600 16px var(--serif)}
.pitem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:baseline;padding:8px 0;border-bottom:1px dashed var(--line)}
.pitem:last-child{border-bottom:0}
.pitem .t{font-size:14px}
.pitem .m{font-size:12px;color:var(--muted);grid-column:1/-1}
.pitem .v{font:500 13px var(--mono);color:var(--ink);white-space:nowrap}
.pitem button{font:inherit;font-size:14px;color:var(--accent);background:none;border:0;padding:0;text-align:left;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.pitem .b{font-size:13px;grid-column:1/-1;color:var(--ink)}
.pitem .b b{font-weight:600}
.parts{grid-column:1/-1;margin:4px 0 2px;padding:0;list-style:none;display:grid;gap:4px;border-left:2px solid var(--line);padding-left:10px}
.parts li{display:flex;justify-content:space-between;gap:12px;font-size:12.5px}
.parts .pv{font:500 12px var(--mono);white-space:nowrap;color:var(--ink)}
.parts li.rest{color:var(--muted);font-style:italic}
.tbl td{white-space:normal;min-width:90px}

.pitem .pd{grid-column:1/-1;font:500 11px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.donut.funds{max-width:340px}
.donut .flabel{font:600 12px var(--sans);fill:var(--ink)}
.donut path.trk{pointer-events:none}
.plegend small{font-size:11px}
.pdetail a{color:var(--accent)}
.parts li button{font:inherit;font-size:12.5px;color:var(--accent);background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;text-underline-offset:2px}

.pnote{font-size:12px;color:var(--muted)}

/* Follow the money */
.money{margin-top:36px;display:grid;gap:14px}
.money>h2{font:600 24px/1.2 var(--serif);margin:0}
.money>p{margin:0;color:var(--muted);max-width:70ch}
.charts{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px}
@media (max-width:820px){.charts{grid-template-columns:1fr}}
.chart{background:var(--surface);border:1px solid var(--line);padding:16px 18px;display:grid;gap:12px;align-content:start}
.chart h3{font:600 17px/1.3 var(--serif);margin:0}
.chart .sub{font-size:13px;color:var(--muted);margin:-6px 0 0}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block}
.bars{display:grid;gap:10px;position:relative}
.bar-row{display:grid;grid-template-columns:minmax(0,42%) minmax(0,1fr);gap:10px;align-items:center;background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left;cursor:default}
button.bar-row{cursor:pointer}
.bar-row:hover .bar,.bar-row:focus-visible .bar{filter:brightness(1.12)}
@media (max-width:480px){.bar-row{grid-template-columns:1fr;gap:4px}}
.bar-label{font-size:13px;line-height:1.3;display:grid}
.bar-label small{color:var(--muted);font-size:11px}
.track{display:block;position:relative;height:22px;padding-right:64px}
.track-inner{display:block;position:relative;height:100%}
.gl{display:block;position:absolute;top:-4px;bottom:-4px;width:1px;background:var(--grid)}
.bar{display:block;position:absolute;left:0;top:2px;height:18px;border-radius:0 4px 4px 0;min-width:2px}
.bar-val{position:absolute;top:0;font:500 12px/22px var(--mono);color:var(--ink);white-space:nowrap;padding-left:6px;font-variant-numeric:tabular-nums}
.axis{display:grid;grid-template-columns:minmax(0,42%) minmax(0,1fr);gap:10px}
@media (max-width:480px){.axis{grid-template-columns:1fr}.axis>span:first-child{display:none}}
.axis .ticks-x{position:relative;height:16px;margin-right:64px}
.axis .ticks-x span{position:absolute;transform:translateX(-50%);font:400 11px var(--mono);color:var(--muted);white-space:nowrap}
.axis .ticks-x span:first-child{transform:none}
.tip{position:fixed;z-index:10;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;line-height:1.45;padding:8px 10px;max-width:260px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.tip b{font-weight:600}
details.tbl{font-size:13px}
details.tbl summary{cursor:pointer;color:var(--accent);font-weight:500}
.tbl-wrap{overflow-x:auto;margin-top:8px}
.tbl table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th{font:500 11px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.tbl td.n{text-align:right}

.about{margin-top:48px;padding-top:20px;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;font-size:13px;color:var(--muted)}
.about h4{font:500 11px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink);margin:0 0 6px}
.about p{margin:0}
@media (max-width:720px){.about{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.entry{transition:border-color .15s}}
</style>
</head>

<div id="app"></div>
<script id="tracker-data" type="application/json">{"updated": "2026-09-25", "benchmarks": [{"label": "UAE investment framework", "detail": "Mar 2025, over 10 years", "bn": 1400, "kind": "pledge", "entry": "e01", "country": "UAE", "buys": "AI infrastructure, semiconductors, energy and manufacturing.", "parts": [{"label": "AI Infrastructure Partnership (MGX, BlackRock, Microsoft) data centers", "bn": 100, "upTo": true}, {"label": "ADQ and Orion critical minerals partnership", "bn": 1.2}, {"label": "Emirates Global Aluminium: first new U.S. aluminum smelter in 35 years", "bn": null}, {"label": "XRG (ADNOC) investment in U.S. natural gas", "bn": null}], "date": "2025-03-21"}, {"label": "Qatar economic exchange", "detail": "May 2025, per White House", "bn": 1200, "kind": "pledge", "country": "Qatar", "entry": "e03", "buys": "Mostly U.S. goods and services Qatar is buying, plus some investment.", "parts": [{"label": "Parsons engineering projects", "bn": 97, "upTo": true}, {"label": "Qatar Airways: up to 210 Boeing 787 and 777X jets (GE engines)", "bn": 96}, {"label": "Future defense purchases: air defense and maritime security", "bn": 38}, {"label": "McDermott LNG projects", "bn": 8.5}, {"label": "General Atomics MQ-9B drones", "bn": 2}, {"label": "Raytheon counter-drone systems", "bn": 1}, {"label": "Quantinuum quantum computing joint venture", "bn": 1, "upTo": true}], "date": "2025-05-14"}, {"label": "Saudi pledge, raised", "detail": "Nov 2025", "bn": 1000, "approx": true, "kind": "pledge", "entry": "e05", "country": "Saudi Arabia", "buys": "Energy, defense, AI and technology, infrastructure, critical minerals, healthcare supply chains and sports.", "parts": [{"label": "U.S. arms package, letter of intent (May 2025)", "bn": 142}, {"label": "DataVolt: U.S. AI data centers and energy infrastructure (May 2025)", "bn": 20}], "date": "2025-11-18"}, {"label": "Saudi pledge, original", "detail": "May 2025", "bn": 600, "kind": "pledge", "entry": "e02", "country": "Saudi Arabia", "superseded": true, "date": "2025-05-13"}, {"label": "PIF total assets", "detail": "2026", "bn": 925, "approx": true, "kind": "fund", "entry": "e08"}, {"label": "PIF international allocation", "detail": "20% target, all countries", "bn": 185, "approx": true, "kind": "fund", "entry": "e08"}], "entries": [{"id": "e01", "date": "2025-03-21", "countries": ["UAE"], "category": "Investment pledge", "status": "Announced", "title": "UAE commits to $1.4 trillion U.S. investment framework", "summary": "After a White House meeting with UAE National Security Adviser Sheikh Tahnoun bin Zayed, the White House announced a 10-year, $1.4 trillion UAE investment framework covering AI infrastructure, semiconductors, energy and manufacturing.", "value": "$1.4T over 10 years", "sources": [{"label": "CNBC", "url": "https://www.cnbc.com/2025/03/21/uae-commits-to-1point4-trillion-investment-framework-in-us-white-house.html"}, {"label": "Bloomberg", "url": "https://www.bloomberg.com/news/articles/2025-03-21/uae-to-pledge-1-4-trillion-us-investment-after-trump-meeting"}], "note": "The figure is more than twice the UAE's annual GDP, so it works as a political ceiling, not a spending schedule. It is credible in parts because Abu Dhabi's state vehicles (ADIA, Mubadala, ADQ, MGX) already put large sums into the U.S. The real ask behind the number was access to advanced AI chips, which makes this the opening move in a capital-for-technology bargain. Watch how much of it is reported as new money versus relabeled existing flows.", "valueBn": null}, {"id": "e02", "date": "2025-05-13", "countries": ["Saudi Arabia"], "category": "Investment pledge", "status": "Announced", "title": "U.S.-Saudi Strategic Economic Partnership signed in Riyadh", "summary": "During President Trump's visit to Riyadh, the two governments signed a Strategic Economic Partnership built on a $600 billion Saudi investment pledge, including a $142 billion letter of intent on defense sales. DataVolt committed $20 billion to U.S. AI data centers and energy infrastructure.", "value": "$600B pledge; $142B defense LOI", "sources": [{"label": "White House fact sheet", "url": "https://www.whitehouse.gov/fact-sheets/2025/05/fact-sheet-president-donald-j-trump-secures-historic-600-billion-investment-commitment-in-saudi-arabia"}, {"label": "Washington Institute", "url": "https://www.washingtoninstitute.org/policy-analysis/unpacking-trumps-2025-gulf-investment-tour"}], "note": "The $600 billion pledge sits on a strained fiscal base: Saudi Arabia runs deficits when oil trades below its budget break-even. The $142 billion defense letter of intent is the most concrete piece, since arms sales move through the Foreign Military Sales system and congressional notification and can be tracked. The pattern set here: Washington treats headline pledges as a summit deliverable, and Riyadh gets political access in return.", "valueBn": null}, {"id": "e03", "date": "2025-05-14", "countries": ["Qatar"], "category": "Commercial deal", "status": "Announced", "title": "Qatar Airways orders up to 210 Boeing aircraft", "summary": "Signed during the Doha leg of the Gulf tour, alongside defense deals including a $2 billion General Atomics MQ-9B drone purchase and a $1 billion Raytheon counter-drone contract. The White House described the aircraft order as the largest in Boeing's history.", "value": "Up to 210 aircraft", "sources": [{"label": "White House fact sheet", "url": "https://www.whitehouse.gov/fact-sheets/2025/05/fact-sheet-president-donald-j-trump-secures-historic-1-2-trillion-economic-commitment-in-qatar/"}], "note": "Qatar's leverage is different from its neighbors'. It rests less on capital pledges and more on hosting Al Udeid Air Base and buying American hardware. A civil aircraft order supports U.S. manufacturing jobs in a way that is easy to point to at home, which is why it led the Doha stop. Aircraft orders deliver over many years and are partly options, so the words \"up to\" matter.", "valueBn": null}, {"id": "e04", "date": "2025-05-15", "countries": ["UAE"], "category": "Tech & export controls", "status": "Announced", "title": "5-gigawatt UAE-U.S. AI Campus announced in Abu Dhabi", "summary": "Announced during the Abu Dhabi leg of the tour as the largest AI data center complex outside the United States. It became the anchor for the Stargate UAE cluster built by G42 with OpenAI, Oracle, Nvidia, Cisco and SoftBank.", "value": "5 GW capacity", "sources": [{"label": "White House fact sheet", "url": "https://www.whitehouse.gov/fact-sheets/2025/05/fact-sheet-president-donald-j-trump-secures-200-billion-in-new-u-s-uae-deals-and-accelerates-previously-committed-1-4-trillion-uae-investment"}, {"label": "U.S. Commerce Department", "url": "https://www.commerce.gov/news/press-releases/2025/05/uae-and-us-presidents-attend-unveiling-phase-1-new-5gw-ai-campus-abu"}], "note": "This is the physical core of the UAE's strategy: turn capital into compute capacity on its own territory. For Washington the question is whether frontier AI infrastructure in the Gulf extends U.S. tech leadership or creates a diversion risk toward China. Having U.S. hyperscalers operate on site under U.S.-approved security terms was the compromise design.", "valueBn": null}, {"id": "e05", "date": "2025-11-18", "countries": ["Saudi Arabia"], "category": "Security & defense", "status": "Signed", "title": "Crown Prince's White House visit: Strategic Defense Agreement and MNNA status", "summary": "Mohammed bin Salman and President Trump signed a Strategic Defense Agreement, and the U.S. designated Saudi Arabia a Major Non-NATO Ally. Side agreements covered an AI memorandum of understanding, civil nuclear cooperation, critical minerals and Treasury capital-markets cooperation. The Crown Prince said Saudi investment in the U.S. would rise from $600 billion to nearly $1 trillion.", "value": "Pledge raised toward ~$1T", "sources": [{"label": "White House fact sheet", "url": "https://www.whitehouse.gov/fact-sheets/2025/11/fact-sheet-president-donald-j-trump-solidifies-economic-and-defense-partnership-with-the-kingdom-of-saudi-arabia/"}, {"label": "CNBC", "url": "https://www.cnbc.com/2025/11/19/from-1-trillion-spending-to-f-35s-us-saudi-pledges-arent-done-deals-yet.html"}], "note": "MNNA status and the defense agreement formalize a relationship that ran on informal understandings, while stopping short of a treaty that would need Senate ratification. Bundling defense with AI, nuclear and critical minerals shows Washington using security guarantees to pull Riyadh's technology and energy choices toward U.S. suppliers and away from China. Watch whether civil nuclear cooperation moves ahead without strict limits on uranium enrichment.", "valueBn": null}, {"id": "e06", "date": "2025-11-20", "countries": ["UAE"], "category": "Tech & export controls", "status": "Approved", "title": "U.S. authorizes advanced AI chip exports to G42", "summary": "G42 announced U.S. approval to import advanced AI semiconductors, moving the Stargate UAE cluster and the wider 5 GW AI Campus from planning into deployment.", "value": "", "sources": [{"label": "G42", "url": "https://www.g42.ai/resources/news/g42-receives-us-approval-advanced-ai-chip-exports-enabling-full-scale-deployment-trusted-ai-infrastructure"}], "note": "This is the payoff for the capital-for-technology bargain struck in March 2025. G42 had set the stage in 2024 by stripping out Chinese hardware and selling Chinese holdings ahead of Microsoft's $1.5 billion investment. The approval shows export licenses working as diplomatic currency, granted in exchange for strategic alignment and not on technical merits alone.", "valueBn": null}, {"id": "e07", "date": "2026-02-28", "countries": ["Region-wide"], "category": "Context", "status": "Ongoing", "title": "U.S. and Israel launch strikes on Iran; Hormuz shipping disrupted", "summary": "The 2026 Iran war (U.S. name: Operation Epic Fury) began on February 28. Fighting around the Strait of Hormuz disrupted Gulf energy exports and put pressure on Gulf state budgets. A June ceasefire broke down in July.", "value": "", "sources": [{"label": "Britannica", "url": "https://www.britannica.com/event/2026-Iran-war"}, {"label": "CFR", "url": "https://www.cfr.org/articles/disappearing-gulf-capital-the-iran-war-risk-wall-street-isnt-watching"}], "note": "The war reshaped nearly every later entry on this tracker. It raised the value of Gulf basing access and air defense cooperation, squeezed Gulf budgets through export disruption, and gave Gulf governments new grounds to ask Washington for concessions. The UAE export-control change, the F-35 approval and the reconstruction fund all trace back to it.", "valueBn": null}, {"id": "e08", "date": "2026-04-15", "countries": ["Saudi Arabia"], "category": "Fund strategy", "status": "Adopted", "title": "PIF's 2026-2030 strategy cuts its overseas share to 20%", "summary": "The Public Investment Fund's board, chaired by the Crown Prince, approved a five-year strategy that targets 80% domestic allocation and cuts international exposure to 20% from a peak of about 30%. The fund manages about $925 billion.", "value": "Intl. share 30% to 20%", "sources": [{"label": "The National", "url": "https://www.thenationalnews.com/business/economy/2026/04/15/saudi-arabias-pif-targets-80-domestic-allocation-cuts-overseas-share-to-20/"}, {"label": "PIF", "url": "https://www.pif.gov.sa/en/news-and-insights/press-releases/2026/chaired-by-hrh-crown-prince-pif-board-of-directors-approves-pif-2026-2030-strategy/"}], "note": "This is the most important counter-signal on the tracker. While leaders announce U.S. investment pledges, PIF's own plan shrinks the share of capital going abroad: 20% of roughly $925 billion is about $185 billion for all international holdings, not just the U.S. That makes the near-$1 trillion Saudi pledge hard to square with actual allocations. Expect it to be met partly through purchases like arms and aircraft and through deals already committed, rather than new PIF money.", "valueBn": null}, {"id": "e09", "date": "2026-07-10", "countries": ["UAE"], "category": "Tech & export controls", "status": "Approved", "title": "Commerce moves UAE into allied tier for sensitive tech exports", "summary": "The Commerce Department reclassified the UAE from a restricted group into the tier used for close partners, so hyperscalers no longer need individual licenses to ship Nvidia and AMD AI chips there. The change also eased rules for certain military items and commercial satellites. Commerce cited the UAE's role as a major defense partner and its support during Operation Epic Fury.", "value": "", "sources": [{"label": "Reuters (via U.S. News)", "url": "https://www.usnews.com/news/world/articles/2026-07-10/us-makes-it-easier-to-export-certain-military-items-ai-chips-and-commercial-satellites-to-the-uae"}], "note": "This moves the UAE from case-by-case licensing to category-level trust, the strongest form of technology access Washington grants. Commerce tied it openly to wartime support, which makes the link between security cooperation and tech access explicit U.S. policy. The precedent risk is clear: Saudi Arabia, with its own AI buildout through HUMAIN, will ask for the same treatment.", "valueBn": null}, {"id": "e10", "date": "2026-08-04", "countries": ["Saudi Arabia"], "category": "Sovereign fund deal", "status": "Completed", "title": "PIF-led consortium completes Electronic Arts take-private", "summary": "PIF, Silver Lake and Affinity Partners closed their acquisition of Electronic Arts, taking the U.S. video game publisher private. PIF had been a minority EA shareholder for more than five years.", "value": "~$55B", "sources": [{"label": "PIF", "url": "https://www.pif.gov.sa/en/news-and-insights/newswire/2026/electronic-arts-announces-completion-of-acquisition-by-pif-silver-lake-and-affinity-partners/"}, {"label": "EA", "url": "https://www.ea.com/news/ea-announces-completion-of-acquisition"}], "note": "EA marks the move from minority stakes to full control of a U.S. consumer brand, part of PIF's sports and gaming soft-power strategy. It closed even as PIF cut its overseas allocation, which suggests flagship deals already in motion continue while new international commitments shrink. Its closing also signals Washington is comfortable with Saudi control in sectors it does not treat as sensitive.", "valueBn": 55, "chartLabel": "Electronic Arts buyout", "flow": "investment", "investors": [{"country": "Saudi Arabia", "fund": "PIF"}], "buys": "Full ownership of Electronic Arts, the U.S. video game publisher (EA Sports FC, Madden, The Sims), taken private."}, {"id": "e11", "date": "2026-09-17", "countries": ["Saudi Arabia"], "category": "Security & defense", "status": "Approved", "title": "State Department clears sale of 48 F-35s to Saudi Arabia", "summary": "The State Department approved a possible Foreign Military Sale of 48 F-35 fighters to Saudi Arabia, starting a 30-day congressional review period. It would be the first F-35 sale to an Arab state.", "value": "~$24.3B", "sources": [{"label": "CNBC", "url": "https://www.cnbc.com/2026/09/18/trump-saudi-arabia-f-35-houthis-iran-war.html"}, {"label": "France 24", "url": "https://www.france24.com/en/middle-east/20260918-us-approves-24-3-billion-sale-of-48-f-35-warplanes-to-saudi-arabia"}], "note": "The sale tests the U.S. legal commitment to Israel's Qualitative Military Edge, which has kept F-35s out of Arab hands; the UAE's 2020 F-35 deal stalled partly over U.S. conditions tied to China. Timing matters: approval came during the Iran war, when Saudi air defense cooperation carried high value. The 30-day review is Congress's window to push back, though blocking an arms sale has historically required a veto-proof majority.", "valueBn": 24.3, "chartLabel": "48 F-35s for Saudi Arabia", "flow": "purchase", "investors": [{"country": "Saudi Arabia", "fund": "Saudi government"}], "buys": "48 Lockheed Martin F-35 stealth fighters through a U.S. Foreign Military Sale."}, {"id": "e12", "date": "2026-09-18", "countries": ["Saudi Arabia", "Qatar", "UAE"], "category": "Regulatory review", "status": "Approved", "title": "FCC clears Gulf funds' stake in Paramount-Warner Bros. deal", "summary": "The FCC let Saudi Arabia's PIF, the Qatar Investment Authority and the UAE's L'imad Holding hold indirect, non-voting equity in the combined Paramount-Warner Bros. Discovery. The three funds committed a combined $24 billion and would own close to half of the equity, while the Ellison family and RedBird keep voting control.", "value": "$24B equity", "sources": [{"label": "Associated Press (via ABC News)", "url": "https://abcnews.com/Business/wireStory/fcc-grants-paramounts-indirect-ownership-request-gulf-funds-136568767"}, {"label": "Variety", "url": "https://variety.com/2026/film/news/fcc-approves-49-5-foreign-ownership-paramount-warner-bros-1236866217/"}], "note": "Gulf capital rarely reaches U.S. media, a sector with foreign-ownership limits under the Communications Act. The FCC's approach, large economic stakes with no voting rights, is a template that lets the U.S. accept Gulf money while keeping control domestic. Watch whether the same structure appears in other sensitive sectors.", "valueBn": 24, "chartLabel": "Gulf equity in Paramount-WBD", "flow": "investment", "investors": [{"country": "Saudi Arabia", "fund": "PIF"}, {"country": "Qatar", "fund": "QIA"}, {"country": "UAE", "fund": "L'imad"}], "buys": "Non-voting equity in the combined Paramount-Warner Bros. Discovery (CBS, CNN, HBO, Warner Bros. studios), close to half the economic stake."}, {"id": "e13", "date": "2026-09-21", "countries": ["Qatar"], "category": "Sovereign fund deal", "status": "Announced", "title": "QIA and J.P. Morgan Asset Management sign $20B partnership", "summary": "The partnership pairs a $15 billion public equities mandate with a $5 billion private markets program focused on senior financing for U.S. mid-market companies in industrials, services, healthcare and technology.", "value": "$20B", "sources": [{"label": "Qatar Investment Authority", "url": "https://www.qia.qa/en/Newsroom/Pages/QIA-and-J-P-Morgan-Asset-Management-Announce-$20-Billion-Strategic-Partnership.aspx"}, {"label": "Bloomberg", "url": "https://www.bloomberg.com/news/articles/2026-09-21/jpmorgan-qatar-s-qia-target-20-billion-investment-partnership"}], "note": "Placing money through a U.S. asset manager, instead of buying companies directly, is a quieter form of investment diplomacy. It supports U.S. mid-market credit and deepens Doha's ties to a major U.S. financial institution without the scrutiny that direct acquisitions attract. Paired with Qatar's new domestic unit, Doha Investment, it mirrors PIF's split between home and abroad.", "valueBn": 20, "chartLabel": "QIA and J.P. Morgan partnership", "flow": "investment", "investors": [{"country": "Qatar", "fund": "QIA"}], "buys": "$15B in U.S. and global stocks managed by J.P. Morgan, plus $5B in senior loans to mid-sized U.S. companies in industrials, services, healthcare and tech."}, {"id": "e14", "date": "2026-09-21", "countries": ["Region-wide"], "category": "Reconstruction & energy", "status": "Proposed", "title": "Administration proposes $5B toward a Gulf energy reconstruction fund", "summary": "According to the Wall Street Journal, the administration proposed $5 billion to start an investment fund that would rebuild Gulf energy sites damaged in the Iran war and build routes that reduce reliance on the Strait of Hormuz. The proposal is under discussion with Saudi Arabia, the UAE and others.", "value": "$5B U.S. share", "sources": [{"label": "U.S. News / Reuters", "url": "https://www.usnews.com/news/top-news/articles/2026-09-21/trump-administration-proposes-5-billion-to-kickstart-investment-fund-to-rebuild-gulf-energy-sites-wsj-reports"}, {"label": "Fortune", "url": "https://fortune.com/2026/09/23/trump-faces-gulf-pressure-for-diplomacy-as-world-leaders-gather-in-new-york/"}], "note": "This reverses the usual direction on the tracker: U.S. public money flowing to the Gulf instead of Gulf capital flowing to the U.S. It frames reconstruction as a way to lock in U.S. firms and reduce Hormuz dependence through alternative export routes. For now it is a proposal reported by one outlet and depends on Gulf partners contributing the rest.", "valueBn": 5, "chartLabel": "Gulf energy rebuild fund (U.S. share)"}, {"id": "e15", "date": "2026-09-16", "countries": ["UAE"], "category": "Sovereign fund deal", "status": "Proposed", "title": "Abu Dhabi's L'imad weighs bid for Apollo's Atlas Air Worldwide", "summary": "Bloomberg reported that L'imad Holding, Abu Dhabi's sovereign investment platform, is considering a bid for a stake in Atlas Air Worldwide, the U.S. air cargo carrier owned by Apollo Global Management. The unit could be valued at $10 billion or more, and multiple outlets described the talks as early-stage with no formal offer made. The interest follows Abu Dhabi's push for logistics routes that bypass the Strait of Hormuz, closed since the Iran war began.", "value": "~$10B Atlas Air valuation (early talks)", "valueBn": null, "sources": [{"label": "Bloomberg", "url": "https://www.bloomberg.com/news/articles/2026-09-16/abu-dhabi-wealth-fund-l-imad-eyes-stake-in-apollo-s-atlas-air-cargo-unit"}], "note": "This is a new front in Gulf capital reaching the United States: logistics and supply-chain infrastructure rather than tech, media or finance. It extends the pattern behind the Gulf energy reconstruction fund proposal (e14), where Abu Dhabi treats Hormuz disruption as a reason to buy resilience abroad. L'imad already controls AD Ports Group and Etihad Rail, so a stake in a U.S. air cargo carrier would extend a logistics chain that runs from the Gulf into American markets. Watch whether this reaches a formal bid, and whether a deal of this size and sector draws CFIUS scrutiny."}, {"id": "e16", "date": "2026-09-20", "countries": ["Qatar"], "category": "Fund strategy", "status": "Adopted", "title": "Qatar launches Doha Investment to run QIA's domestic portfolio", "summary": "Qatar's prime minister announced the launch of Doha Investment, a new platform that will manage the Qatar Investment Authority's domestic holdings, including Qatar Airways, QNB, Ooredoo, Qatari Diar, Katara Hospitality and Hassad Food. The announcement came at the Qatar Economic Forum in New York, one day before QIA signed its $20 billion partnership with J.P. Morgan Asset Management.", "value": "", "valueBn": null, "sources": [{"label": "Semafor", "url": "https://www.semafor.com/article/09/21/2026/qatar-investment-authority-consolidates-domestic-portfolio"}], "note": "This is Doha's version of the split PIF adopted in April (e08): separate the fund's domestic champion-building from its international dealmaking. A dedicated domestic platform makes it easier for QIA's international headline numbers, like the $20 billion J.P. Morgan mandate signed a day later, to read as genuinely new capital aimed abroad rather than money cycling through local holdings. For Washington that is a reason to expect cleaner Qatari pledges going forward, though how much of QIA's roughly $530 billion in assets reaches the U.S. still depends on the split the fund keeps between Doha Investment and its international book."}], "funds": [{"name": "PIF", "full": "Public Investment Fund", "country": "Saudi Arabia", "bn": 925, "approx": true, "asOf": "Apr 2026", "note": "Figure reported with PIF's 2026-2030 strategy, which keeps only about 20% of assets abroad", "src": "The National", "url": "https://www.thenationalnews.com/business/economy/2026/04/15/saudi-arabias-pif-targets-80-domestic-allocation-cuts-overseas-share-to-20/"}, {"name": "QIA", "full": "Qatar Investment Authority", "country": "Qatar", "bn": 580, "approx": true, "asOf": "Jan 2026", "note": "Bloomberg's figure; QIA does not publish its total", "src": "Bloomberg", "url": "https://www.bloomberg.com/news/articles/2026-01-21/qatar-s-580-billion-wealth-fund-said-to-weigh-radical-overhaul"}, {"name": "ADIA", "full": "Abu Dhabi Investment Authority", "country": "UAE", "bn": 1000, "approx": true, "asOf": "Sep 2026", "note": "Bloomberg describes ADIA as a roughly $1 trillion fund; ADIA does not publish its total", "src": "Bloomberg", "url": "https://www.bloomberg.com/news/articles/2026-09-10/abu-dhabi-s-1-trillion-fund-ups-private-equity-hedge-fund-bets"}, {"name": "Mubadala", "full": "Mubadala Investment Company", "country": "UAE", "bn": 385, "approx": false, "asOf": "end of 2025", "note": "Official figure from Mubadala's annual results", "src": "Mubadala", "url": "https://www.mubadala.com/en/news/strong-performance-by-uae-portfolio-drives-mubadalas-growth-in-2025"}, {"name": "L'imad", "full": "L'imad Holding (includes ADQ)", "country": "UAE", "bn": 263, "approx": true, "asOf": "Jan 2026", "note": "At least the $263B in ADQ assets folded into L'imad in January 2026", "src": "The National", "url": "https://www.thenationalnews.com/business/2026/01/30/abu-dhabi-to-consolidate-assets-of-adq-under-limad/"}], "finance": {"ea": {"ev": 55, "debt": 18, "equity": 36, "fy26ebitda": 2.141, "growth": 0.04, "savings": 0.7, "useSavings": true, "rate": 0.075, "tax": 0.21, "conv": 0.6, "exit": 16, "target": 0.15, "years": 5, "fy26": {"revenue": 7.531, "bookings": 8.026, "opInc": 1.162, "da": 0.323, "sbc": 0.656, "fcf": 2.323}, "sources": [{"label": "EA / Silver Lake deal announcement", "url": "https://www.silverlake.com/ea-announces-agreement-to-be-acquired-by-pif-silver-lake-and-affinity-partners-for-55-billion/"}, {"label": "EA FY2026 results (SEC filing)", "url": "https://www.sec.gov/Archives/edgar/data/712515/000071251526000053/earningspressrelease2026_0.htm"}, {"label": "Bloomberg ($700M cost savings)", "url": "https://www.bloomberg.com/news/articles/2026-03-23/ea-touts-700-million-buyout-cost-savings-to-coax-debt-investors"}]}, "oil": {"beImf": 91, "bePif": 111, "periods": [{"l <script id="app-js">
(function(){
  var STATE = JSON.parse(document.getElementById('tracker-data').textContent);
  var COUNTRIES = ['Saudi Arabia','UAE','Qatar','Region-wide'];
  var CATEGORIES = ['Investment pledge','Sovereign fund deal','Commercial deal','Tech & export controls','Security & defense','Regulatory review','Fund strategy','Reconstruction & energy','Context'];
  var STATUSES = ['Proposed','Announced','Signed','Approved','Adopted','Completed','Ongoing'];
  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var ui = { q:'', country:'', category:'', canEdit:false, editing:null, confirmDel:null, busy:false, msg:'' };
  var artifactNs = null;

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function safeUrl(u){ return /^https?:\/\//i.test(u||'') ? u : '#'; }
  function fmtDate(d){ var p=d.split('-'); return MONTHS[+p[1]-1]+' '+(+p[2])+', '+p[0]; }
  function monthKey(d){ return d.slice(0,7); }
  function monthLabel(k){ var p=k.split('-'); return MONTHS[+p[1]-1]+' '+p[0]; }
  function sorted(){ return STATE.entries.slice().sort(function(a,b){ return a.date<b.date?1:a.date>b.date?-1:(a.id<b.id?1:-1); }); }

  function filtered(){
    var q = ui.q.trim().toLowerCase();
    return sorted().filter(function(e){
      if (ui.country && e.countries.indexOf(ui.country)<0) return false;
      if (ui.category && e.category!==ui.category) return false;
      if (q){
        var hay=(e.title+' '+e.summary+' '+e.note+' '+e.category+' '+e.countries.join(' ')).toLowerCase();
        if (hay.indexOf(q)<0) return false;
      }
      return true;
    });
  }

  function statusClass(s){ return STATUSES.indexOf(s)>=0 ? 'st-'+s : 'st-other'; }

  function renderStrip(){
    var all = STATE.entries, real = all.filter(function(e){return e.category!=='Context';});
    var done = real.filter(function(e){return e.status==='Completed'||e.status==='Approved'||e.status==='Signed'||e.status==='Adopted';}).length;
    var pending = real.filter(function(e){return e.status==='Announced'||e.status==='Proposed';}).length;
    var notes = all.filter(function(e){return (e.note||'').trim();}).length;
    var dates = all.map(function(e){return e.date;}).sort();
    var span = dates.length ? monthLabel(monthKey(dates[0]))+' to '+monthLabel(monthKey(dates[dates.length-1])) : '';
    return '<div class="strip">'+
      stat('Events tracked', real.length, span)+
      stat('Pledged, not yet realized', pending, 'Announced or proposed')+
      stat('Signed, approved or closed', done, 'Moved past announcement')+
      stat('Analyst notes', notes+' / '+all.length, 'Entries with analysis')+
    '</div>';
  }
  function stat(k,v,s){ return '<div class="stat"><span class="k">'+esc(k)+'</span><span class="v">'+esc(v)+'</span><span class="s">'+esc(s)+'</span></div>'; }

  function renderLedger(){
    return '<div class="ledger" role="group" aria-label="Filter by country">'+COUNTRIES.map(function(c){
      var list = sorted().filter(function(e){return e.countries.indexOf(c)>=0;});
      var ticks = list.slice().reverse().map(function(e){return '<span class="tick'+(e.category==='Context'?' t-ctx':'')+'" title="'+esc(fmtDate(e.date)+': '+e.title)+'"></span>';}).join('');
      var last = list[0] ? fmtDate(list[0].date)+': '+list[0].title : 'No entries yet';
      return '<button type="button" class="lane" data-country="'+esc(c)+'" aria-pressed="'+(ui.country===c)+'">'+
        '<span class="name">'+esc(c)+'<span>'+list.length+'</span></span>'+
        '<span class="ticks">'+ticks+'</span>'+
        '<span class="last">'+esc(last)+'</span></button>';
    }).join('')+'</div>';
  }


  function fmtBn(v){ return v>=1000 ? '$'+(Math.round(v/100)/10)+'T' : '$'+(v%1?v.toFixed(1):v)+'B'; }
  function niceMax(m){ var steps=[10,20,25,50,60,100,200,250,500,1000,1500,2000,2500,5000]; for(var i=0;i<steps.length;i++){ if(steps[i]>=m) return steps[i]; } return Math.ceil(m/1000)*1000; }
  function tickSet(max){ var n = (max%3===0 && (max/3)%5===0) ? 3 : 4; var out=[]; for(var i=0;i<=n;i++) out.push(max*i/n); return out; }
  function barChart(rows, opts){
    var max = niceMax(Math.max.apply(null, rows.map(function(r){return r.bn;})));
    var ticks = tickSet(max);
    var grid = ticks.map(function(v){ return '<span class="gl" style="left:'+(v/max*100)+'%"></span>'; }).join('');
    var body = rows.map(function(r){
      var pct = r.bn/max*100, tag = r.target ? 'button type="button" data-goto="'+esc(r.target)+'"' : 'div tabindex="0"';
      var close = r.target ? 'button' : 'div';
      return '<'+tag+' class="bar-row" data-tip="'+esc(r.tip)+'" aria-label="'+esc(r.label+': '+fmtBn(r.bn))+'">'+
        '<span class="bar-label">'+esc(r.label)+(r.small?'<small>'+esc(r.small)+'</small>':'')+'</span>'+
        '<span class="track"><span class="track-inner">'+grid+
          '<span class="bar" style="width:'+pct+'%;background:var('+r.color+')"></span>'+
          '<span class="bar-val" style="left:'+pct+'%">'+(r.approx?'~':'')+esc(fmtBn(r.bn))+'</span>'+
        '</span></span></'+close+'>';
    }).join('');
    var axis = '<div class="axis"><span></span><div class="ticks-x">'+ticks.map(function(v,i){ return '<span style="left:'+(v/max*100)+'%">'+(i===0?'0':fmtBn(v))+'</span>'; }).join('')+'</div></div>';
    return '<div class="bars">'+body+'</div>'+axis;
  }
  function tableOf(rows, cols){
    return '<details class="tbl"><summary>View as table</summary><div class="tbl-wrap"><table><thead><tr>'+cols.map(function(c){return '<th>'+esc(c[0])+'</th>';}).join('')+'</tr></thead><tbody>'+
      rows.map(function(r){ return '<tr>'+cols.map(function(c){ var v=c[1](r); return '<td'+(c[2]?' class="n"':'')+'>'+esc(v)+'</td>'; }).join('')+'</tr>'; }).join('')+'</tbody></table></div></details>';
  }
  function renderMoney(){
    var bm = (STATE.benchmarks||[]).map(function(b){ return { label:b.label, small:b.detail, bn:b.bn, approx:b.approx, color: b.kind==='fund' ? '--c-fund' : '--c-pledge', target:b.entry||'', kind:b.kind,
      tip:'<b>'+esc(b.label)+'</b><br>'+(b.approx?'About ':'')+fmtBn(b.bn)+(b.detail?' · '+esc(b.detail):'')+'<br>'+(b.kind==='fund'?'What the fund actually holds':'Headline pledge, not disbursed money') }; });
    var deals = STATE.entries.filter(function(e){ return typeof e.valueBn==='number' && e.valueBn>0 && e.category!=='Investment pledge'; })
      .sort(function(a,b){ return b.valueBn-a.valueBn; })
      .map(function(e){ return { label:e.chartLabel||(e.title.length>40?e.title.slice(0,38).replace(/\s+\S*$/,'')+'…':e.title), small:e.countries.join(', ')+' · '+e.status, bn:e.valueBn, approx:/^~/.test(e.value||''), color:'--c-fund', target:e.id,
        tip:'<b>'+esc(e.title)+'</b><br>'+fmtDate(e.date)+' · '+esc(e.status)+'<br>'+esc(e.value||fmtBn(e.valueBn))+'<br>Click to jump to the entry', status:e.status, date:e.date, full:e.title }; });
    return '<section class="money" aria-labelledby="money-h">'+
      '<h2 id="money-h">Follow the money</h2>'+
      '<p>Headline pledges run into the trillions, but the capital behind them is smaller and increasingly kept at home. The left chart sets the pledges against Saudi Arabia\'s Public Investment Fund; the right shows the deals that have actually moved money or cleared a regulator.</p>'+
      '<div class="charts">'+
        '<div class="chart"><h3>Pledges vs. the fund behind them</h3><p class="sub">Billions of U.S. dollars</p>'+
          '<div class="legend"><span><i class="sw" style="background:var(--c-pledge)"></i>Government pledge</span><span><i class="sw" style="background:var(--c-fund)"></i>Sovereign fund capital</span></div>'+
          barChart(bm)+
          tableOf(bm,[['Item',function(r){return r.label;}],['Type',function(r){return r.kind==='fund'?'Fund capital':'Pledge';}],['$ billions',function(r){return (r.approx?'~':'')+r.bn.toLocaleString('en-US');},1]])+
        '</div>'+
        '<div class="chart"><h3>Deals with a dollar figure</h3><p class="sub">Billions of U.S. dollars, largest first. Select a bar to open its entry.</p>'+
          (deals.length? barChart(deals) : '<p class="sub">No deals with a dollar figure yet.</p>')+
          tableOf(deals,[['Deal',function(r){return r.full;}],['Date',function(r){return fmtDate(r.date);}],['Status',function(r){return r.status;}],['$ billions',function(r){return (r.approx?'~':'')+r.bn.toLocaleString('en-US');},1]])+
        '</div>'+
      '</div>'+
    '</section>';
  }

  var PIE_COUNTRIES=[{k:'Saudi Arabia',c:'--c-sa'},{k:'Qatar',c:'--c-qa'},{k:'UAE',c:'--c-ae'},{k:'Joint',c:'',label:'Joint (all three)'}];
  var pieUi={view:'deals',arms:false,sel:null};
  function pieData(){
    var groups={}; PIE_COUNTRIES.forEach(function(p){groups[p.k]={key:p.k,bn:0,items:[]};});
    if (pieUi.view==='pledges'){
      (STATE.benchmarks||[]).forEach(function(b){ if(b.kind==='pledge'&&b.country&&!b.superseded&&groups[b.country]){ groups[b.country].bn+=b.bn; groups[b.country].items.push({date:b.date||'',title:b.label,meta:(b.detail||'')+' · headline pledge, not money spent',bn:b.bn,approx:b.approx,target:b.entry||'',buys:b.buys||'',parts:b.parts||[]}); } });
    } else {
      STATE.entries.forEach(function(e){
        if (typeof e.valueBn!=='number'||!e.investors||!e.investors.length) return;
        if (e.flow==='purchase' && !pieUi.arms) return;
        var cs={}; e.investors.forEach(function(i){cs[i.country]=1;});
        var key=Object.keys(cs).length>1?'Joint':e.investors[0].country;
        if(!groups[key]) return;
        groups[key].bn+=e.valueBn;
        groups[key].items.push({date:e.date,title:e.chartLabel||e.title,meta:e.investors.map(function(i){return i.fund+' ('+i.country+')';}).join(', ')+' · '+(e.flow==='purchase'?'Arms purchase':'Investment')+' · '+e.status,bn:e.valueBn,approx:/^~/.test(e.value||''),target:e.id,buys:e.buys||'',parts:[]});
      });
    }
    return PIE_COUNTRIES.map(function(p){ var g=groups[p.k]; g.color=p.c; g.label=p.label||p.k; return g; });
  }
  function fillFor(g){ return g.key==='Joint' ? 'url(#joint-stripes)' : 'var('+g.color+')'; }
  function arcPath(cx,cy,r0,r1,a0,a1){
    var large=(a1-a0)>Math.PI?1:0, s=Math.sin, c=Math.cos;
    if (a1-a0>=Math.PI*2-1e-6){ a1=a0+Math.PI*2-1e-4; large=1; }
    var p=function(r,a){return (cx+r*s(a)).toFixed(2)+' '+(cy-r*c(a)).toFixed(2);};
    return 'M'+p(r1,a0)+' A'+r1+' '+r1+' 0 '+large+' 1 '+p(r1,a1)+' L'+p(r0,a1)+' A'+r0+' '+r0+' 0 '+large+' 0 '+p(r0,a0)+' Z';
  }

  function pieSeg(){
    return '<div class="seg" role="group" aria-label="Chart view"><button type="button" id="pv-deals" aria-pressed="'+(pieUi.view==='deals')+'">Deals with a price</button><button type="button" id="pv-pledges" aria-pressed="'+(pieUi.view==='pledges')+'">Headline pledges</button><button type="button" id="pv-funds" aria-pressed="'+(pieUi.view==='funds')+'">Fund size</button></div>';
  }
  var CC={'Saudi Arabia':'--c-sa','Qatar':'--c-qa','UAE':'--c-ae'};
  function renderFunds(){
    var funds=(STATE.funds||[]).map(function(f){
      var solo=[], joint=[];
      STATE.entries.forEach(function(e){
        if (typeof e.valueBn!=='number'||!e.investors||e.flow==='purchase') return;
        var mine=e.investors.some(function(i){return i.fund===f.name;}); if(!mine) return;
        (e.investors.length>1?joint:solo).push(e);
      });
      var tracked=solo.reduce(function(s,e){return s+e.valueBn;},0);
      return {f:f,solo:solo,joint:joint,tracked:tracked};
    });
    var total=funds.reduce(function(s,x){return s+x.f.bn;},0), tracked=funds.reduce(function(s,x){return s+x.tracked;},0);
    var jointBn=0, seen={}; funds.forEach(function(x){ x.joint.forEach(function(e){ if(!seen[e.id]){seen[e.id]=1; jointBn+=e.valueBn;} }); });
    if (pieUi.sel && !funds.some(function(x){return x.f.name===pieUi.sel;})) pieUi.sel=null;
    var sel = pieUi.sel ? funds.filter(function(x){return x.f.name===pieUi.sel;})[0] : null;
    var cx=180, cy=170, r0=78, r1=128, a=0, paths='', labels='';
    funds.forEach(function(x){
      var span=x.f.bn/total*Math.PI*2, a1=a+span, col='var('+CC[x.f.country]+')', key=x.f.name, isSel=pieUi.sel===key;
      var tip='<b>'+esc(x.f.full)+'</b><br>'+esc(x.f.country)+' · '+(x.f.approx?'about ':'')+fmtBn(x.f.bn)+'<br>Tracked U.S. deals here: '+(x.tracked?fmtBn(x.tracked)+' ('+(x.tracked/x.f.bn*100).toFixed(1)+'%)':'none')+(x.joint.length?' + share of joint deal':'')+'<br>Click for details';
      paths+='<path class="'+(isSel?'sel':'')+'" d="'+arcPath(cx,cy,r0,r1,a,a1)+'" fill="'+col+'" fill-opacity="0.3" tabindex="0" role="button" data-pie="'+esc(key)+'" data-tip="'+esc(tip)+'" aria-label="'+esc(x.f.full+': '+fmtBn(x.f.bn))+'"></path>';
      if (x.tracked>0){ var t1=a+Math.max(x.tracked/total*Math.PI*2,0.02); paths+='<path class="'+(isSel?'sel':'')+' trk" d="'+arcPath(cx,cy,r0,r1,a,t1)+'" fill="'+col+'" data-pie="'+esc(key)+'" data-tip="'+esc(tip)+'"></path>'; }
      var mid=(a+a1)/2, lx=cx+(r1+12)*Math.sin(mid), ly=cy-(r1+12)*Math.cos(mid), anchor=Math.sin(mid)>0.15?'start':(Math.sin(mid)<-0.15?'end':'middle');
      labels+='<text class="flabel" x="'+lx.toFixed(1)+'" y="'+(ly+4).toFixed(1)+'" text-anchor="'+anchor+'">'+esc(x.f.name)+'</text>';
      a=a1;
    });
    var cBig = sel ? fmtBn(sel.f.bn) : fmtBn(total), cSmall = sel ? sel.f.name : 'Five funds';
    var svg='<svg class="donut funds'+(sel?' has-sel':'')+'" viewBox="-30 0 420 340" role="img" aria-label="Donut chart of Gulf sovereign fund sizes with the share tracked on this site">'+paths+labels+
      '<text class="c-big" x="'+cx+'" y="'+(cy+2)+'" text-anchor="middle">'+esc(cBig)+'</text><text class="c-small" x="'+cx+'" y="'+(cy+24)+'" text-anchor="middle">'+esc(cSmall)+'</text></svg>';
    var legend='<div class="plegend" role="group" aria-label="Funds">'+funds.map(function(x){
      return '<button type="button" data-pie="'+esc(x.f.name)+'" aria-pressed="'+(pieUi.sel===x.f.name)+'"><i class="sw14" style="background:var('+CC[x.f.country]+')"></i><span>'+esc(x.f.name)+' <small class="z">'+esc(x.f.country)+'</small></span><span class="v">'+(x.f.approx?'~':'')+fmtBn(x.f.bn)+'</span></button>';
    }).join('')+'</div>';
    var key='<p class="pnote"><span class="sw14" style="background:var(--ink);opacity:.9;vertical-align:-2px"></span> Solid = U.S. deals with a price tracked on this site. <span class="sw14" style="background:var(--ink);opacity:.25;vertical-align:-2px"></span> Faded = the rest of the fund.</p>';
    var list = sel ? [sel] : funds;
    var detail='<div class="pdetail"><h4>'+(sel?esc(sel.f.full):'How much of each fund this tracker covers')+'</h4>'+

  function eaModel(p){
    var ltm=p.fy26ebitda+(p.useSavings?p.savings:0), debt=p.debt, rows=[], base=p.fy26ebitda;
    for (var y=1;y<=p.years;y++){
      base=base*(1+p.growth);
      var sav=p.useSavings?(y===1?p.savings*0.5:p.savings):0, e=base+sav, open=debt, intr=open*p.rate, cash=e*p.conv;
      var repay=Math.max(0,Math.min(open,cash-intr*(1-p.tax))); debt=open-repay;
      rows.push({y:2026+y,e:e,open:open,intr:intr,repay:repay,close:debt});
    }
    var ex=rows[rows.length-1].e, exitEv=ex*p.exit, exitEq=exitEv-debt, moic=p.equity>0?exitEq/p.equity:0, irr=moic>0?Math.pow(moic,1/p.years)-1:-1;
    var need=(p.equity*Math.pow(1+p.target,p.years)+debt)/ex;
    return {eq:p.equity,ltm:ltm,rows:rows,exitE:ex,exitEv:exitEv,debtExit:debt,exitEq:exitEq,moic:moic,irr:irr,need:need,entryMult:p.ev/ltm,lev:p.debt/ltm};
  }
