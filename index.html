<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A sourced timeline of Gulf sovereign investment, U.S.-GCC deals, export-control decisions and arms sales, maintained by Xavier Davis.">
<title>Gulf Statecraft Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link id="app-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style id="app-style">
:root{
  --bg:#EDF1EF; --surface:#F8FAF9; --ink:#15241F; --muted:#56655F; --line:#CBD5D0;
  --accent:#0E6B5C; --accent-soft:#D5E8E2; --amber:#9A5B0C; --amber-soft:#F3E4CC;
  --ok:#2F6B34; --ok-soft:#DDEBD9; --warn:#8A5A00; --info:#2D4F7C; --info-soft:#DCE5F1;
  --grey-soft:#E1E6E3; --c-pledge:#B07A2A; --c-fund:#138A74; --grid:#DCE3E0;
  --serif:"Spectral", Georgia, "Times New Roman", serif;
  --sans:"Public Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1614; --surface:#15201D; --ink:#E3EBE8; --muted:#9AABA4; --line:#2A3834;
    --accent:#5CC4AA; --accent-soft:#16332C; --amber:#E0A857; --amber-soft:#3A2B14;
    --ok:#8CC98F; --ok-soft:#1C3220; --info:#9DB9E0; --info-soft:#1C2A3D; --grey-soft:#222E2B; --c-pledge:#B5802E; --c-fund:#3FA88E; --grid:#24312D;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1614; --surface:#15201D; --ink:#E3EBE8; --muted:#9AABA4; --line:#2A3834;
  --accent:#5CC4AA; --accent-soft:#16332C; --amber:#E0A857; --amber-soft:#3A2B14;
  --ok:#8CC98F; --ok-soft:#1C3220; --info:#9DB9E0; --info-soft:#1C2A3D; --grey-soft:#222E2B; --c-pledge:#B5802E; --c-fund:#3FA88E; --grid:#24312D;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding-inline:20px;padding-block:32px 64px}
@media (max-width:480px){.wrap{padding-inline:16px;padding-block:20px 48px}}

/* Masthead */
.mast{display:grid;gap:18px;padding-bottom:24px;border-bottom:1px solid var(--line)}
.eyebrow{font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
h1{font:600 clamp(30px,5vw,44px)/1.1 var(--serif);margin:0;text-wrap:balance;letter-spacing:-.01em}
.lede{max-width:66ch;margin:0;color:var(--muted);font-size:16px}
.byline{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 16px}
.byline strong{color:var(--ink);font-weight:600}

/* Summary strip */
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-top:24px}
.stat{background:var(--surface);padding:14px 16px;display:grid;gap:4px}
.stat .k{font:500 11px/1.2 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.stat .v{font:600 24px/1.1 var(--serif);font-variant-numeric:tabular-nums}
.stat .s{font-size:12px;color:var(--muted)}
@media (max-width:720px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* Country ledger */
.ledger{margin-top:28px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:720px){.ledger{grid-template-columns:repeat(2,minmax(0,1fr))}}
.lane{background:var(--surface);border:1px solid var(--line);padding:12px 14px;display:grid;gap:8px;cursor:pointer;text-align:left;color:inherit;font:inherit}
.lane:hover{border-color:var(--accent)}
.lane[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.lane .name{font-weight:600;display:flex;justify-content:space-between;gap:8px}
.lane .name span{font:500 12px var(--mono);color:var(--muted)}
.ticks{display:flex;flex-wrap:wrap;gap:3px;min-height:10px}
.tick{width:10px;height:10px;background:var(--accent)}
.tick.t-ctx{background:var(--line)}
.lane .last{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Controls */
.controls{margin-top:28px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.controls input,.controls select{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);padding:8px 10px;min-width:0}
.controls input{flex:1 1 220px}
.controls select{flex:0 1 220px}
.count{font:500 12px var(--mono);color:var(--muted);margin-left:auto}
.btn{font:600 14px var(--sans);border:1px solid var(--accent);background:var(--accent);color:var(--surface);padding:8px 14px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{border-color:#A33;background:#A33;color:#fff}
.btn.small{font-size:12px;padding:4px 10px}
.btn:disabled{opacity:.5;cursor:default}

/* Timeline */
.timeline{margin-top:20px;display:grid;gap:28px}
.month{display:grid;grid-template-columns:120px minmax(0,1fr);gap:16px}
@media (max-width:640px){.month{grid-template-columns:1fr;gap:8px}}
.mlabel{font:500 13px/1.3 var(--mono);color:var(--muted);letter-spacing:.04em;text-transform:uppercase;padding-top:14px;position:sticky;top:env(safe-area-inset-top,0px);align-self:start}
@media (max-width:640px){.mlabel{position:static;padding-top:0;border-bottom:1px solid var(--line);padding-bottom:6px}}
.entries{display:grid;gap:12px}
.entry{background:var(--surface);border:1px solid var(--line);padding:16px 18px;display:grid;gap:10px}
.entry.ctx{background:transparent;border-style:dashed}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px}
.date{font:500 12px var(--mono);color:var(--muted);margin-right:4px;font-variant-numeric:tabular-nums}
.chip{font:500 11px/1 var(--mono);letter-spacing:.04em;padding:5px 7px;border:1px solid var(--line);color:var(--muted);text-transform:uppercase}
.chip.cty{color:var(--ink)}
.pill{font:600 11px/1 var(--sans);padding:5px 8px;border-radius:999px}
.st-Announced,.st-Proposed{background:var(--amber-soft);color:var(--amber)}
.st-Signed,.st-Adopted,.st-Approved{background:var(--info-soft);color:var(--info)}
.st-Completed{background:var(--ok-soft);color:var(--ok)}
.st-Ongoing,.st-other{background:var(--grey-soft);color:var(--muted)}
.entry h3{font:600 19px/1.3 var(--serif);margin:0;text-wrap:balance}
.row{display:flex;justify-content:space-between;gap:16px;align-items:baseline;flex-wrap:wrap}
.value{font:500 13px var(--mono);color:var(--accent);white-space:nowrap}
.summary{margin:0;max-width:72ch}
.sources{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}
.sources a{text-underline-offset:2px}
.note{border-left:3px solid var(--accent);background:var(--accent-soft);padding:10px 14px;display:grid;gap:4px}
.note .k{font:500 11px/1 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
.note p{margin:0;white-space:pre-wrap}
.note.empty{background:transparent;border-left-color:var(--line)}
.note.empty p{color:var(--muted);font-style:italic}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.empty-state{padding:32px;text-align:center;color:var(--muted);border:1px dashed var(--line)}

/* Editor */
.editor{margin-top:20px;background:var(--surface);border:1px solid var(--accent);padding:18px;display:grid;gap:14px}
.editor h2{font:600 20px var(--serif);margin:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
.field{display:grid;gap:4px;min-width:0}
.field label,.field legend{font:500 12px var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);padding:8px 10px;width:100%}
.field textarea{min-height:84px;resize:vertical}
fieldset.field{border:0;padding:0;margin:0}
.checks{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px}
.hint{font-size:12px;color:var(--muted)}
.msg{font-size:13px;color:var(--amber)}

/* Follow the money */
.money{margin-top:36px;display:grid;gap:14px}
.money>h2{font:600 24px/1.2 var(--serif);margin:0}
.money>p{margin:0;color:var(--muted);max-width:70ch}
.charts{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px}
@media (max-width:820px){.charts{grid-template-columns:1fr}}
.chart{background:var(--surface);border:1px solid var(--line);padding:16px 18px;display:grid;gap:12px;align-content:start}
.chart h3{font:600 17px/1.3 var(--serif);margin:0}
.chart .sub{font-size:13px;color:var(--muted);margin:-6px 0 0}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block}
.bars{display:grid;gap:10px;position:relative}
.bar-row{display:grid;grid-template-columns:minmax(0,42%) minmax(0,1fr);gap:10px;align-items:center;background:none;border:0;padding:0;font:inherit;color:inherit;text-align:left;cursor:default}
button.bar-row{cursor:pointer}
.bar-row:hover .bar,.bar-row:focus-visible .bar{filter:brightness(1.12)}
@media (max-width:480px){.bar-row{grid-template-columns:1fr;gap:4px}}
.bar-label{font-size:13px;line-height:1.3;display:grid}
.bar-label small{color:var(--muted);font-size:11px}
.track{display:block;position:relative;height:22px;padding-right:64px}
.track-inner{display:block;position:relative;height:100%}
.gl{display:block;position:absolute;top:-4px;bottom:-4px;width:1px;background:var(--grid)}
.bar{display:block;position:absolute;left:0;top:2px;height:18px;border-radius:0 4px 4px 0;min-width:2px}
.bar-val{position:absolute;top:0;font:500 12px/22px var(--mono);color:var(--ink);white-space:nowrap;padding-left:6px;font-variant-numeric:tabular-nums}
.axis{display:grid;grid-template-columns:minmax(0,42%) minmax(0,1fr);gap:10px}
@media (max-width:480px){.axis{grid-template-columns:1fr}.axis>span:first-child{display:none}}
.axis .ticks-x{position:relative;height:16px;margin-right:64px}
.axis .ticks-x span{position:absolute;transform:translateX(-50%);font:400 11px var(--mono);color:var(--muted);white-space:nowrap}
.axis .ticks-x span:first-child{transform:none}
.tip{position:fixed;z-index:10;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;line-height:1.45;padding:8px 10px;max-width:260px;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.tip b{font-weight:600}
details.tbl{font-size:13px}
details.tbl summary{cursor:pointer;color:var(--accent);font-weight:500}
.tbl-wrap{overflow-x:auto;margin-top:8px}
.tbl table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th{font:500 11px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.tbl td.n{text-align:right}

.about{margin-top:48px;padding-top:20px;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px;font-size:13px;color:var(--muted)}
.about h4{font:500 11px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink);margin:0 0 6px}
.about p{margin:0}
@media (max-width:720px){.about{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.entry{transition:border-color .15s}}
</style>
</head>

<script id="tracker-data" type="application/json">{"updated": "2026-09-25", "benchmarks": [{"label": "UAE investment framework", "detail": "Mar 2025, over 10 years", "bn": 1400, "kind": "pledge", "entry": "e01"}, {"label": "Saudi pledge, raised", "detail": "Nov 2025", "bn": 1000, "approx": true, "kind": "pledge", "entry": "e05"}, {"label": "Saudi pledge, original", "detail": "May 2025", "bn": 600, "kind": "pledge", "entry": "e02"}, {"label": "PIF total assets", "detail": "2026", "bn": 925, "approx": true, "kind": "fund", "entry": "e08"}, {"label": "PIF international allocation", "detail": "20% target, all countries", "bn": 185, "approx": true, "kind": "fund", "entry": "e08"}], "entries": [{"id": "e01", "date": "2025-03-21", "countries": ["UAE"], "category": "Investment pledge", "status": "Announced", "title": "UAE commits to $1.4 trillion U.S. investment framework", "summary": "After a White House meeting with UAE National Security Adviser Sheikh Tahnoun bin Zayed, the White House announced a 10-year, $1.4 trillion UAE investment framework covering AI infrastructure, semiconductors, energy and manufacturing.", "value": "$1.4T over 10 years", "sources": [{"label": "CNBC", "url": "https://www.cnbc.com/2025/03/21/uae-commits-to-1point4-trillion-investment-framework-in-us-white-house.html"}, {"label": "Al Arabiya", "url": "https://english.alarabiya.net/News/united-states/2025/03/21/after-trump-meeting-uae-commits-to-10-year-1-4-trillion-investment-framework-in-us"}], "note": "The figure is more than twice the UAE's annual GDP, so it works as a political ceiling, not a spending schedule. It is credible in parts because Abu Dhabi's state vehicles (ADIA, Mubadala, ADQ, MGX) already put large sums into the U.S. The real ask behind the number was access to advanced AI chips, which makes this the opening move in a capital-for-technology bargain. Watch how much of it is reported as new money versus relabeled existing flows.", "valueBn": null}, {"id": "e02", "date": "2025-05-13", "countries": ["Saudi Arabia"], "category": "Investment pledge", "status": "Announced", "title": "U.S.-Saudi Strategic Economic Partnership signed in Riyadh", "summary": "During President Trump's visit to Riyadh, the two governments signed a Strategic Economic Partnership built on a $600 billion Saudi investment pledge, including a $142 billion letter of intent on defense sales. DataVolt committed $20 billion to U.S. AI data centers and energy infrastructure.", "value": "$600B pledge; $142B defense LOI", "sources": [{"label": "Washington Institute", "url": "https://www.washingtoninstitute.org/policy-analysis/unpacking-trumps-2025-gulf-investment-tour"}, {"label": "Wikipedia", "url": "https://en.wikipedia.org/wiki/2025_state_visits_by_Donald_Trump_to_Saudi_Arabia,_Qatar,_and_the_United_Arab_Emirates"}], "note": "The $600 billion pledge sits on a strained fiscal base: Saudi Arabia runs deficits when oil trades below its budget break-even. The $142 billion defense letter of intent is the most concrete piece, since arms sales move through the Foreign Military Sales system and congressional notification and can be tracked. The pattern set here: Washington treats headline pledges as a summit deliverable, and Riyadh gets political access in return.", "valueBn": null}, {"id": "e03", "date": "2025-05-14", "countries": ["Qatar"], "category": "Commercial deal", "status": "Announced", "title": "Qatar Airways orders up to 210 Boeing aircraft", "summary": "Signed during the Doha leg of the Gulf tour, alongside defense deals including a $2 billion General Atomics MQ-9B drone purchase and a $1 billion Raytheon counter-drone contract. The White House described the aircraft order as the largest in Boeing's history.", "value": "Up to 210 aircraft", "sources": [{"label": "Wikipedia", "url": "https://en.wikipedia.org/wiki/2025_state_visits_by_Donald_Trump_to_Saudi_Arabia,_Qatar,_and_the_United_Arab_Emirates"}, {"label": "Brownstein", "url": "https://www.bhfs.com/insights/alerts-articles/2025/trump-secures-trillion-dollar-deals-during-gulf-visit-signaling-shift-to-commercial-diplomacy"}], "note": "Qatar's leverage is different from its neighbors'. It rests less on capital pledges and more on hosting Al Udeid Air Base and buying American hardware. A civil aircraft order supports U.S. manufacturing jobs in a way that is easy to point to at home, which is why it led the Doha stop. Aircraft orders deliver over many years and are partly options, so the words \"up to\" matter.", "valueBn": null}, {"id": "e04", "date": "2025-05-15", "countries": ["UAE"], "category": "Tech & export controls", "status": "Announced", "title": "5-gigawatt UAE-U.S. AI Campus announced in Abu Dhabi", "summary": "Announced during the Abu Dhabi leg of the tour as the largest AI data center complex outside the United States. It became the anchor for the Stargate UAE cluster built by G42 with OpenAI, Oracle, Nvidia, Cisco and SoftBank.", "value": "5 GW capacity", "sources": [{"label": "Rest of World", "url": "https://restofworld.org/2025/trump-middle-east-trip-ai-chip-tech-deals/"}, {"label": "Wikipedia", "url": "https://en.wikipedia.org/wiki/2025_state_visits_by_Donald_Trump_to_Saudi_Arabia,_Qatar,_and_the_United_Arab_Emirates"}], "note": "This is the physical core of the UAE's strategy: turn capital into compute capacity on its own territory. For Washington the question is whether frontier AI infrastructure in the Gulf extends U.S. tech leadership or creates a diversion risk toward China. Having U.S. hyperscalers operate on site under U.S.-approved security terms was the compromise design.", "valueBn": null}, {"id": "e05", "date": "2025-11-18", "countries": ["Saudi Arabia"], "category": "Security & defense", "status": "Signed", "title": "Crown Prince's White House visit: Strategic Defense Agreement and MNNA status", "summary": "Mohammed bin Salman and President Trump signed a Strategic Defense Agreement, and the U.S. designated Saudi Arabia a Major Non-NATO Ally. Side agreements covered an AI memorandum of understanding, civil nuclear cooperation, critical minerals and Treasury capital-markets cooperation. The Crown Prince said Saudi investment in the U.S. would rise from $600 billion to nearly $1 trillion.", "value": "Pledge raised toward ~$1T", "sources": [{"label": "Al Arabiya", "url": "https://english.alarabiya.net/News/saudi-arabia/2025/11/19/trump-mbs-sign-ussaudi-strategic-defense-agreement"}, {"label": "CNBC", "url": "https://www.cnbc.com/2025/11/19/from-1-trillion-spending-to-f-35s-us-saudi-pledges-arent-done-deals-yet.html"}], "note": "MNNA status and the defense agreement formalize a relationship that ran on informal understandings, while stopping short of a treaty that would need Senate ratification. Bundling defense with AI, nuclear and critical minerals shows Washington using security guarantees to pull Riyadh's technology and energy choices toward U.S. suppliers and away from China. Watch whether civil nuclear cooperation moves ahead without strict limits on uranium enrichment.", "valueBn": null}, {"id": "e06", "date": "2025-11-20", "countries": ["UAE"], "category": "Tech & export controls", "status": "Approved", "title": "U.S. authorizes advanced AI chip exports to G42", "summary": "G42 announced U.S. approval to import advanced AI semiconductors, moving the Stargate UAE cluster and the wider 5 GW AI Campus from planning into deployment.", "value": "", "sources": [{"label": "G42", "url": "https://www.g42.ai/resources/news/g42-receives-us-approval-advanced-ai-chip-exports-enabling-full-scale-deployment-trusted-ai-infrastructure"}], "note": "This is the payoff for the capital-for-technology bargain struck in March 2025. G42 had set the stage in 2024 by stripping out Chinese hardware and selling Chinese holdings ahead of Microsoft's $1.5 billion investment. The approval shows export licenses working as diplomatic currency, granted in exchange for strategic alignment and not on technical merits alone.", "valueBn": null}, {"id": "e07", "date": "2026-02-28", "countries": ["Region-wide"], "category": "Context", "status": "Ongoing", "title": "U.S. and Israel launch strikes on Iran; Hormuz shipping disrupted", "summary": "The 2026 Iran war (U.S. name: Operation Epic Fury) began on February 28. Fighting around the Strait of Hormuz disrupted Gulf energy exports and put pressure on Gulf state budgets. A June ceasefire broke down in July.", "value": "", "sources": [{"label": "Britannica", "url": "https://www.britannica.com/event/2026-Iran-war"}, {"label": "CFR", "url": "https://www.cfr.org/articles/disappearing-gulf-capital-the-iran-war-risk-wall-street-isnt-watching"}], "note": "The war reshaped nearly every later entry on this tracker. It raised the value of Gulf basing access and air defense cooperation, squeezed Gulf budgets through export disruption, and gave Gulf governments new grounds to ask Washington for concessions. The UAE export-control change, the F-35 approval and the reconstruction fund all trace back to it.", "valueBn": null}, {"id": "e08", "date": "2026-04-15", "countries": ["Saudi Arabia"], "category": "Fund strategy", "status": "Adopted", "title": "PIF's 2026-2030 strategy cuts its overseas share to 20%", "summary": "The Public Investment Fund's board, chaired by the Crown Prince, approved a five-year strategy that targets 80% domestic allocation and cuts international exposure to 20% from a peak of about 30%. The fund manages about $925 billion.", "value": "Intl. share 30% to 20%", "sources": [{"label": "The National", "url": "https://www.thenationalnews.com/business/economy/2026/04/15/saudi-arabias-pif-targets-80-domestic-allocation-cuts-overseas-share-to-20/"}, {"label": "PIF", "url": "https://www.pif.gov.sa/en/news-and-insights/press-releases/2026/chaired-by-hrh-crown-prince-pif-board-of-directors-approves-pif-2026-2030-strategy/"}], "note": "This is the most important counter-signal on the tracker. While leaders announce U.S. investment pledges, PIF's own plan shrinks the share of capital going abroad: 20% of roughly $925 billion is about $185 billion for all international holdings, not just the U.S. That makes the near-$1 trillion Saudi pledge hard to square with actual allocations. Expect it to be met partly through purchases like arms and aircraft and through deals already committed, rather than new PIF money.", "valueBn": null}, {"id": "e09", "date": "2026-07-10", "countries": ["UAE"], "category": "Tech & export controls", "status": "Approved", "title": "Commerce moves UAE into allied tier for sensitive tech exports", "summary": "The Commerce Department reclassified the UAE from a restricted group into the tier used for close partners, so hyperscalers no longer need individual licenses to ship Nvidia and AMD AI chips there. The change also eased rules for certain military items and commercial satellites. Commerce cited the UAE's role as a major defense partner and its support during Operation Epic Fury.", "value": "", "sources": [{"label": "U.S. News / Reuters", "url": "https://www.usnews.com/news/world/articles/2026-07-10/us-makes-it-easier-to-export-certain-military-items-ai-chips-and-commercial-satellites-to-the-uae"}, {"label": "DCD", "url": "https://www.datacenterdynamics.com/en/news/us-govt-eases-ai-chip-export-controls-on-uae-following-countrys-support-in-iran-war/"}], "note": "This moves the UAE from case-by-case licensing to category-level trust, the strongest form of technology access Washington grants. Commerce tied it openly to wartime support, which makes the link between security cooperation and tech access explicit U.S. policy. The precedent risk is clear: Saudi Arabia, with its own AI buildout through HUMAIN, will ask for the same treatment.", "valueBn": null}, {"id": "e10", "date": "2026-08-04", "countries": ["Saudi Arabia"], "category": "Sovereign fund deal", "status": "Completed", "title": "PIF-led consortium completes Electronic Arts take-private", "summary": "PIF, Silver Lake and Affinity Partners closed their acquisition of Electronic Arts, taking the U.S. video game publisher private. PIF had been a minority EA shareholder for more than five years.", "value": "~$55B", "sources": [{"label": "PIF", "url": "https://www.pif.gov.sa/en/news-and-insights/newswire/2026/electronic-arts-announces-completion-of-acquisition-by-pif-silver-lake-and-affinity-partners/"}, {"label": "EA", "url": "https://www.ea.com/news/ea-announces-completion-of-acquisition"}], "note": "EA marks the move from minority stakes to full control of a U.S. consumer brand, part of PIF's sports and gaming soft-power strategy. It closed even as PIF cut its overseas allocation, which suggests flagship deals already in motion continue while new international commitments shrink. Its closing also signals Washington is comfortable with Saudi control in sectors it does not treat as sensitive.", "valueBn": 55, "chartLabel": "Electronic Arts buyout"}, {"id": "e11", "date": "2026-09-17", "countries": ["Saudi Arabia"], "category": "Security & defense", "status": "Approved", "title": "State Department clears sale of 48 F-35s to Saudi Arabia", "summary": "The State Department approved a possible Foreign Military Sale of 48 F-35 fighters to Saudi Arabia, starting a 30-day congressional review period. It would be the first F-35 sale to an Arab state.", "value": "~$24.3B", "sources": [{"label": "CNBC", "url": "https://www.cnbc.com/2026/09/18/trump-saudi-arabia-f-35-houthis-iran-war.html"}, {"label": "France 24", "url": "https://www.france24.com/en/middle-east/20260918-us-approves-24-3-billion-sale-of-48-f-35-warplanes-to-saudi-arabia"}], "note": "The sale tests the U.S. legal commitment to Israel's Qualitative Military Edge, which has kept F-35s out of Arab hands; the UAE's 2020 F-35 deal stalled partly over U.S. conditions tied to China. Timing matters: approval came during the Iran war, when Saudi air defense cooperation carried high value. The 30-day review is Congress's window to push back, though blocking an arms sale has historically required a veto-proof majority.", "valueBn": 24.3, "chartLabel": "48 F-35s for Saudi Arabia"}, {"id": "e12", "date": "2026-09-18", "countries": ["Saudi Arabia", "Qatar", "UAE"], "category": "Regulatory review", "status": "Approved", "title": "FCC clears Gulf funds' stake in Paramount-Warner Bros. deal", "summary": "The FCC let Saudi Arabia's PIF, the Qatar Investment Authority and the UAE's L'imad Holding hold indirect, non-voting equity in the combined Paramount-Warner Bros. Discovery. The three funds committed a combined $24 billion and would own close to half of the equity, while the Ellison family and RedBird keep voting control.", "value": "$24B equity", "sources": [{"label": "AP via ClickOnDetroit", "url": "https://www.clickondetroit.com/business/2026/09/18/fcc-grants-paramounts-indirect-ownership-request-for-gulf-funds-in-warner-bros-discovery-buyout/"}, {"label": "Variety", "url": "https://variety.com/2026/film/news/fcc-approves-49-5-foreign-ownership-paramount-warner-bros-1236866217/"}], "note": "Gulf capital rarely reaches U.S. media, a sector with foreign-ownership limits under the Communications Act. The FCC's approach, large economic stakes with no voting rights, is a template that lets the U.S. accept Gulf money while keeping control domestic. Watch whether the same structure appears in other sensitive sectors.", "valueBn": 24, "chartLabel": "Gulf equity in Paramount-WBD"}, {"id": "e13", "date": "2026-09-21", "countries": ["Qatar"], "category": "Sovereign fund deal", "status": "Announced", "title": "QIA and J.P. Morgan Asset Management sign $20B partnership", "summary": "The partnership pairs a $15 billion public equities mandate with a $5 billion private markets program focused on senior financing for U.S. mid-market companies in industrials, services, healthcare and technology.", "value": "$20B", "sources": [{"label": "QIA", "url": "https://www.qia.qa/en/Newsroom/Pages/QIA-and-J-P-Morgan-Asset-Management-Announce-$20-Billion-Strategic-Partnership.aspx"}, {"label": "PR Newswire", "url": "https://www.prnewswire.com/news-releases/qia-and-jp-morgan-asset-management-announce-20-billion-strategic-partnership-302884641.html"}], "note": "Placing money through a U.S. asset manager, instead of buying companies directly, is a quieter form of investment diplomacy. It supports U.S. mid-market credit and deepens Doha's ties to a major U.S. financial institution without the scrutiny that direct acquisitions attract. Paired with Qatar's new domestic unit, Doha Investment, it mirrors PIF's split between home and abroad.", "valueBn": 20, "chartLabel": "QIA and J.P. Morgan partnership"}, {"id": "e14", "date": "2026-09-21", "countries": ["Region-wide"], "category": "Reconstruction & energy", "status": "Proposed", "title": "Administration proposes $5B toward a Gulf energy reconstruction fund", "summary": "According to the Wall Street Journal, the administration proposed $5 billion to start an investment fund that would rebuild Gulf energy sites damaged in the Iran war and build routes that reduce reliance on the Strait of Hormuz. The proposal is under discussion with Saudi Arabia, the UAE and others.", "value": "$5B U.S. share", "sources": [{"label": "U.S. News / Reuters", "url": "https://www.usnews.com/news/top-news/articles/2026-09-21/trump-administration-proposes-5-billion-to-kickstart-investment-fund-to-rebuild-gulf-energy-sites-wsj-reports"}, {"label": "Fortune", "url": "https://fortune.com/2026/09/23/trump-faces-gulf-pressure-for-diplomacy-as-world-leaders-gather-in-new-york/"}], "note": "This reverses the usual direction on the tracker: U.S. public money flowing to the Gulf instead of Gulf capital flowing to the U.S. It frames reconstruction as a way to lock in U.S. firms and reduce Hormuz dependence through alternative export routes. For now it is a proposal reported by one outlet and depends on Gulf partners contributing the rest.", "valueBn": 5, "chartLabel": "Gulf energy rebuild fund (U.S. share)"}]}</script>
<script id="app-js">
(function(){
  var STATE = JSON.parse(document.getElementById('tracker-data').textContent);
  var COUNTRIES = ['Saudi Arabia','UAE','Qatar','Region-wide'];
  var CATEGORIES = ['Investment pledge','Sovereign fund deal','Commercial deal','Tech & export controls','Security & defense','Regulatory review','Fund strategy','Reconstruction & energy','Context'];
  var STATUSES = ['Proposed','Announced','Signed','Approved','Adopted','Completed','Ongoing'];
  var MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var ui = { q:'', country:'', category:'', canEdit:false, editing:null, confirmDel:null, busy:false, msg:'' };
  var artifactNs = null;

  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function safeUrl(u){ return /^https?:\/\//i.test(u||'') ? u : '#'; }
  function fmtDate(d){ var p=d.split('-'); return MONTHS[+p[1]-1]+' '+(+p[2])+', '+p[0]; }
  function monthKey(d){ return d.slice(0,7); }
  function monthLabel(k){ var p=k.split('-'); return MONTHS[+p[1]-1]+' '+p[0]; }
  function sorted(){ return STATE.entries.slice().sort(function(a,b){ return a.date<b.date?1:a.date>b.date?-1:(a.id<b.id?1:-1); }); }

  function filtered(){
    var q = ui.q.trim().toLowerCase();
    return sorted().filter(function(e){
      if (ui.country && e.countries.indexOf(ui.country)<0) return false;
      if (ui.category && e.category!==ui.category) return false;
      if (q){
        var hay=(e.title+' '+e.summary+' '+e.note+' '+e.category+' '+e.countries.join(' ')).toLowerCase();
        if (hay.indexOf(q)<0) return false;
      }
      return true;
    });
  }

  function statusClass(s){ return STATUSES.indexOf(s)>=0 ? 'st-'+s : 'st-other'; }

  function renderStrip(){
    var all = STATE.entries, real = all.filter(function(e){return e.category!=='Context';});
    var done = real.filter(function(e){return e.status==='Completed'||e.status==='Approved'||e.status==='Signed'||e.status==='Adopted';}).length;
    var pending = real.filter(function(e){return e.status==='Announced'||e.status==='Proposed';}).length;
    var notes = all.filter(function(e){return (e.note||'').trim();}).length;
    var dates = all.map(function(e){return e.date;}).sort();
    var span = dates.length ? monthLabel(monthKey(dates[0]))+' to '+monthLabel(monthKey(dates[dates.length-1])) : '';
    return '<div class="strip">'+
      stat('Events tracked', real.length, span)+
      stat('Pledged, not yet realized', pending, 'Announced or proposed')+
      stat('Signed, approved or closed', done, 'Moved past announcement')+
      stat('Analyst notes', notes+' / '+all.length, 'Entries with analysis')+
    '</div>';
  }
  function stat(k,v,s){ return '<div class="stat"><span class="k">'+esc(k)+'</span><span class="v">'+esc(v)+'</span><span class="s">'+esc(s)+'</span></div>'; }

  function renderLedger(){
    return '<div class="ledger" role="group" aria-label="Filter by country">'+COUNTRIES.map(function(c){
      var list = sorted().filter(function(e){return e.countries.indexOf(c)>=0;});
      var ticks = list.slice().reverse().map(function(e){return '<span class="tick'+(e.category==='Context'?' t-ctx':'')+'" title="'+esc(fmtDate(e.date)+': '+e.title)+'"></span>';}).join('');
      var last = list[0] ? fmtDate(list[0].date)+': '+list[0].title : 'No entries yet';
      return '<button type="button" class="lane" data-country="'+esc(c)+'" aria-pressed="'+(ui.country===c)+'">'+
        '<span class="name">'+esc(c)+'<span>'+list.length+'</span></span>'+
        '<span class="ticks">'+ticks+'</span>'+
        '<span class="last">'+esc(last)+'</span></button>';
    }).join('')+'</div>';
  }


  function fmtBn(v){ return v>=1000 ? '$'+(Math.round(v/100)/10)+'T' : '$'+(v%1?v.toFixed(1):v)+'B'; }
  function niceMax(m){ var steps=[10,20,25,50,60,100,200,250,500,1000,1500,2000,2500,5000]; for(var i=0;i<steps.length;i++){ if(steps[i]>=m) return steps[i]; } return Math.ceil(m/1000)*1000; }
  function tickSet(max){ var n = (max%3===0 && (max/3)%5===0) ? 3 : 4; var out=[]; for(var i=0;i<=n;i++) out.push(max*i/n); return out; }
  function barChart(rows, opts){
    var max = niceMax(Math.max.apply(null, rows.map(function(r){return r.bn;})));
    var ticks = tickSet(max);
    var grid = ticks.map(function(v){ return '<span class="gl" style="left:'+(v/max*100)+'%"></span>'; }).join('');
    var body = rows.map(function(r){
      var pct = r.bn/max*100, tag = r.target ? 'button type="button" data-goto="'+esc(r.target)+'"' : 'div tabindex="0"';
      var close = r.target ? 'button' : 'div';
      return '<'+tag+' class="bar-row" data-tip="'+esc(r.tip)+'" aria-label="'+esc(r.label+': '+fmtBn(r.bn))+'">'+
        '<span class="bar-label">'+esc(r.label)+(r.small?'<small>'+esc(r.small)+'</small>':'')+'</span>'+
        '<span class="track"><span class="track-inner">'+grid+
          '<span class="bar" style="width:'+pct+'%;background:var('+r.color+')"></span>'+
          '<span class="bar-val" style="left:'+pct+'%">'+(r.approx?'~':'')+esc(fmtBn(r.bn))+'</span>'+
        '</span></span></'+close+'>';
    }).join('');
    var axis = '<div class="axis"><span></span><div class="ticks-x">'+ticks.map(function(v,i){ return '<span style="left:'+(v/max*100)+'%">'+(i===0?'0':fmtBn(v))+'</span>'; }).join('')+'</div></div>';
    return '<div class="bars">'+body+'</div>'+axis;
  }
  function tableOf(rows, cols){
    return '<details class="tbl"><summary>View as table</summary><div class="tbl-wrap"><table><thead><tr>'+cols.map(function(c){return '<th>'+esc(c[0])+'</th>';}).join('')+'</tr></thead><tbody>'+
      rows.map(function(r){ return '<tr>'+cols.map(function(c){ var v=c[1](r); return '<td'+(c[2]?' class="n"':'')+'>'+esc(v)+'</td>'; }).join('')+'</tr>'; }).join('')+'</tbody></table></div></details>';
  }
  function renderMoney(){
    var bm = (STATE.benchmarks||[]).map(function(b){ return { label:b.label, small:b.detail, bn:b.bn, approx:b.approx, color: b.kind==='fund' ? '--c-fund' : '--c-pledge', target:b.entry||'', kind:b.kind,
      tip:'<b>'+esc(b.label)+'</b><br>'+(b.approx?'About ':'')+fmtBn(b.bn)+(b.detail?' · '+esc(b.detail):'')+'<br>'+(b.kind==='fund'?'What the fund actually holds':'Headline pledge, not disbursed money') }; });
    var deals = STATE.entries.filter(function(e){ return typeof e.valueBn==='number' && e.valueBn>0 && e.category!=='Investment pledge'; })
      .sort(function(a,b){ return b.valueBn-a.valueBn; })
      .map(function(e){ return { label:e.chartLabel||(e.title.length>40?e.title.slice(0,38).replace(/\s+\S*$/,'')+'…':e.title), small:e.countries.join(', ')+' · '+e.status, bn:e.valueBn, approx:/^~/.test(e.value||''), color:'--c-fund', target:e.id,
        tip:'<b>'+esc(e.title)+'</b><br>'+fmtDate(e.date)+' · '+esc(e.status)+'<br>'+esc(e.value||fmtBn(e.valueBn))+'<br>Click to jump to the entry', status:e.status, date:e.date, full:e.title }; });
    return '<section class="money" aria-labelledby="money-h">'+
      '<h2 id="money-h">Follow the money</h2>'+
      '<p>Headline pledges run into the trillions, but the capital behind them is smaller and increasingly kept at home. The left chart sets the pledges against Saudi Arabia\'s Public Investment Fund; the right shows the deals that have actually moved money or cleared a regulator.</p>'+
      '<div class="charts">'+
        '<div class="chart"><h3>Pledges vs. the fund behind them</h3><p class="sub">Billions of U.S. dollars</p>'+
          '<div class="legend"><span><i class="sw" style="background:var(--c-pledge)"></i>Government pledge</span><span><i class="sw" style="background:var(--c-fund)"></i>Sovereign fund capital</span></div>'+
          barChart(bm)+
          tableOf(bm,[['Item',function(r){return r.label;}],['Type',function(r){return r.kind==='fund'?'Fund capital':'Pledge';}],['$ billions',function(r){return (r.approx?'~':'')+r.bn.toLocaleString('en-US');},1]])+
        '</div>'+
        '<div class="chart"><h3>Deals with a dollar figure</h3><p class="sub">Billions of U.S. dollars, largest first. Select a bar to open its entry.</p>'+
          (deals.length? barChart(deals) : '<p class="sub">No deals with a dollar figure yet.</p>')+
          tableOf(deals,[['Deal',function(r){return r.full;}],['Date',function(r){return fmtDate(r.date);}],['Status',function(r){return r.status;}],['$ billions',function(r){return (r.approx?'~':'')+r.bn.toLocaleString('en-US');},1]])+
        '</div>'+
      '</div>'+
    '</section>';
  }

  function renderControls(n){
    var cats = '<option value="">All categories</option>'+CATEGORIES.map(function(c){return '<option'+(ui.category===c?' selected':'')+'>'+esc(c)+'</option>';}).join('');
    return '<div class="controls">'+
      '<input id="q" type="search" placeholder="Search entries and notes" aria-label="Search" value="'+esc(ui.q)+'">'+
      '<select id="cat" aria-label="Category">'+cats+'</select>'+
      (ui.country?'<button type="button" class="btn ghost small" id="clear-country">'+esc(ui.country)+' ×</button>':'')+
      (ui.canEdit && !ui.editing ? '<button type="button" class="btn" id="add">Add entry</button>' : '')+
      '<span class="count">'+n+' shown</span>'+
    '</div>';
  }

  function renderEntry(e){
    var noteHtml = (e.note||'').trim()
      ? '<div class="note"><span class="k">Analysis</span><p>'+esc(e.note)+'</p></div>'
      : (ui.canEdit ? '<div class="note empty"><span class="k">Analysis</span><p>No analysis yet. Use Edit to add why this matters.</p></div>' : '');
    var tools = '';
    if (ui.canEdit){
      if (ui.confirmDel===e.id){
        tools = '<div class="tools"><span class="hint">Delete this entry for good?</span><button type="button" class="btn danger small" data-act="del-yes" data-id="'+esc(e.id)+'">Delete</button><button type="button" class="btn ghost small" data-act="del-no">Keep</button></div>';
      } else {
        tools = '<div class="tools"><button type="button" class="btn ghost small" data-act="edit" data-id="'+esc(e.id)+'">Edit</button><button type="button" class="btn ghost small" data-act="del" data-id="'+esc(e.id)+'">Delete</button></div>';
      }
    }
    return '<article class="entry'+(e.category==='Context'?' ctx':'')+'" id="'+esc(e.id)+'">'+
      '<div class="meta"><span class="date">'+esc(fmtDate(e.date))+'</span>'+
        e.countries.map(function(c){return '<span class="chip cty">'+esc(c)+'</span>';}).join('')+
        '<span class="chip">'+esc(e.category)+'</span>'+
        '<span class="pill '+statusClass(e.status)+'">'+esc(e.status)+'</span></div>'+
      '<div class="row"><h3>'+esc(e.title)+'</h3>'+(e.value?'<span class="value">'+esc(e.value)+'</span>':'')+'</div>'+
      '<p class="summary">'+esc(e.summary)+'</p>'+
      noteHtml+
      (e.sources&&e.sources.length?'<div class="sources">Sources: '+e.sources.map(function(s){return '<a href="'+esc(safeUrl(s.url))+'" target="_blank" rel="noopener">'+esc(s.label||s.url)+'</a>';}).join('')+'</div>':'')+
      tools+
    '</article>';
  }

  function renderTimeline(list){
    if (!list.length) return '<div class="empty-state">No entries match these filters.</div>';
    var groups=[], cur=null;
    list.forEach(function(e){ var k=monthKey(e.date); if(!cur||cur.k!==k){cur={k:k,items:[]};groups.push(cur);} cur.items.push(e); });
    return '<div class="timeline">'+groups.map(function(g){
      return '<section class="month"><div class="mlabel">'+esc(monthLabel(g.k))+'</div><div class="entries">'+g.items.map(renderEntry).join('')+'</div></section>';
    }).join('')+'</div>';
  }

  function renderEditor(){
    var e = ui.editing; if (!e) return '';
    var isNew = !STATE.entries.some(function(x){return x.id===e.id;});
    var src = (e.sources||[]).concat([{label:'',url:''},{label:'',url:''}]).slice(0,2);
    function opts(list,val){ return list.map(function(o){return '<option'+(o===val?' selected':'')+'>'+esc(o)+'</option>';}).join(''); }
    return '<form class="editor" id="editor" novalidate>'+
      '<h2>'+(isNew?'New entry':'Edit entry')+'</h2>'+
      '<div class="grid2">'+
        '<div class="field"><label for="f-date">Date</label><input id="f-date" type="date" required value="'+esc(e.date)+'"></div>'+
        '<div class="field"><label for="f-value">Headline value</label><input id="f-value" placeholder="e.g. $20B" value="'+esc(e.value)+'"></div>'+
        '<div class="field"><label for="f-bn">Chart value ($ billions)</label><input id="f-bn" type="number" step="0.1" min="0" placeholder="Leave blank to keep off the chart" value="'+(typeof e.valueBn==='number'?e.valueBn:'')+'"></div>'+
        '<div class="field"></div>'+
        '<div class="field"><label for="f-cat">Category</label><select id="f-cat">'+opts(CATEGORIES,e.category)+'</select></div>'+
        '<div class="field"><label for="f-status">Status</label><select id="f-status">'+opts(STATUSES,e.status)+'</select></div>'+
      '</div>'+
      '<fieldset class="field"><legend>Countries</legend><div class="checks">'+COUNTRIES.map(function(c,i){
        return '<label><input type="checkbox" id="f-c'+i+'" value="'+esc(c)+'"'+(e.countries.indexOf(c)>=0?' checked':'')+'> '+esc(c)+'</label>';
      }).join('')+'</div></fieldset>'+
      '<div class="field"><label for="f-title">Headline</label><input id="f-title" required value="'+esc(e.title)+'"></div>'+
      '<div class="field"><label for="f-summary">What happened (facts only)</label><textarea id="f-summary">'+esc(e.summary)+'</textarea></div>'+
      '<div class="field"><label for="f-note">Analysis: why it matters</label><textarea id="f-note" placeholder="Your read on the statecraft angle: leverage, precedent, what to watch next.">'+esc(e.note)+'</textarea></div>'+
      '<div class="grid2">'+
        '<div class="field"><label for="f-s0l">Source 1 name</label><input id="f-s0l" value="'+esc(src[0].label)+'"></div>'+
        '<div class="field"><label for="f-s0u">Source 1 link</label><input id="f-s0u" type="url" value="'+esc(src[0].url)+'"></div>'+
        '<div class="field"><label for="f-s1l">Source 2 name</label><input id="f-s1l" value="'+esc(src[1].label)+'"></div>'+
        '<div class="field"><label for="f-s1u">Source 2 link</label><input id="f-s1u" type="url" value="'+esc(src[1].url)+'"></div>'+
      '</div>'+
      (ui.msg?'<div class="msg" role="status">'+esc(ui.msg)+'</div>':'')+
      '<div class="tools"><button class="btn" type="submit"'+(ui.busy?' disabled':'')+'>'+(ui.busy?'Saving…':'Save and publish')+'</button><button class="btn ghost" type="button" id="cancel">Cancel</button></div>'+
      '<p class="hint">Saving publishes a new version of this page for everyone who has the link.</p>'+
    '</form>';
  }

  function render(){
    var list = filtered();
    var focusId = document.activeElement && document.activeElement.id;
    document.getElementById('app').innerHTML =
      '<div class="wrap">'+
        '<header class="mast">'+
          '<span class="eyebrow">Economic statecraft · U.S.-Gulf</span>'+
          '<h1>Gulf Statecraft Tracker</h1>'+
          '<p class="lede">A running record of how capital, technology access and arms sales move between Washington and the Gulf monarchies: sovereign wealth fund deals, investment pledges, export-control decisions and the policy moves around them.</p>'+
          '<div class="byline"><span>Maintained by <strong>Xavier Davis</strong></span><span>School of International Service, American University</span><span>Last updated '+esc(fmtDate(STATE.updated))+'</span></div>'+
        '</header>'+
        renderStrip()+
        renderLedger()+
        renderMoney()+
        renderEditor()+
        renderControls(list.length)+
        renderTimeline(list)+
        '<footer class="about">'+
          '<div><h4>What counts</h4><p>Government-to-government pledges, sovereign wealth fund transactions touching the U.S., export-control and CFIUS/FCC decisions, and major arms sales involving Saudi Arabia, the UAE and Qatar.</p></div>'+
          '<div><h4>Reading the figures</h4><p>Values are headline figures as announced. Pledges are not disbursements, and many multi-year commitments overlap with deals counted elsewhere.</p></div>'+
          '<div><h4>Status key</h4><p>Proposed or Announced: stated, not binding. Signed, Approved or Adopted: formally agreed or cleared. Completed: the transaction closed.</p></div>'+
        '</footer>'+
      '</div>';
    if (focusId){ var el=document.getElementById(focusId); if(el){ el.focus(); if(el.id==='q'){ try{ el.setSelectionRange(el.value.length,el.value.length);}catch(_){} } } }
  }

  function readForm(){
    var e = ui.editing;
    var g = function(id){ var el=document.getElementById(id); return el?el.value.trim():''; };
    var countries = COUNTRIES.filter(function(c,i){ var el=document.getElementById('f-c'+i); return el&&el.checked; });
    var sources = [[g('f-s0l'),g('f-s0u')],[g('f-s1l'),g('f-s1u')]].filter(function(s){return s[1];}).map(function(s){return {label:s[0]||s[1].replace(/^https?:\/\/(www\.)?/,'').split('/')[0], url:s[1]};});
    return { id:e.id, date:g('f-date'), countries:countries, category:g('f-cat'), status:g('f-status'), title:g('f-title'), summary:g('f-summary'), value:g('f-value'), sources:sources, note:(document.getElementById('f-note')||{}).value||'', valueBn:(function(v){ var n=parseFloat(v); return isFinite(n)&&n>0?n:null; })(g('f-bn')) };
  }

  function todayISO(){ var d=new Date(); var m=d.getMonth()+1, dd=d.getDate(); return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(dd<10?'0':'')+dd; }

  function buildDoc(state){
    var json = JSON.stringify(state).replace(/</g,'\\u003c');
    var css = document.getElementById('app-style').textContent;
    var js = document.getElementById('app-js').textContent;
    var fonts = document.getElementById('app-fonts').getAttribute('href');
    var S='scr'+'ipt';
    return '<!doctype html>\n<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">'+
      '<title>Gulf Statecraft Tracker</title>'+
      '<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>'+
      '<link id="app-fonts" rel="stylesheet" href="'+fonts.replace(/&/g,'&amp;')+'">'+
      '<style id="app-style">'+css+'</style></head><body><div id="app"></div>'+
      '<'+S+' id="tracker-data" type="application/json">'+json+'</'+S+'>'+
      '<'+S+' id="app-js">'+js+'</'+S+'></body></html>';
  }

  function save(next){
    if (!artifactNs){ ui.msg='Saving is not available in this view.'; render(); return; }
    ui.busy=true; ui.msg=''; render();
    artifactNs.publish(buildDoc(next)).then(function(){ /* the view reloads to the new version */ }, function(err){
      ui.busy=false;
      var code = err && err.code;
      if (code==='conflict'){ ui.msg='A newer version was just published. The page is reloading to it.'; }
      else if (code==='not_writer'||code==='not_granted'||code==='not_declared'||code==='capability_disabled'||code==='consent_required'){ ui.canEdit=false; ui.editing=null; ui.confirmDel=null; ui.msg=''; }
      else if (code==='rate_limited'){ ui.msg='Too many saves in a row. Wait a minute and try again.'; }
      else { ui.msg='The save did not go through. Try again in a moment.'; }
      render();
    });
  }

  document.addEventListener('input', function(ev){
    if (ev.target.id==='q'){ ui.q=ev.target.value; render(); }
  });
  document.addEventListener('change', function(ev){
    if (ev.target.id==='cat'){ ui.category=ev.target.value; render(); }
  });
  document.addEventListener('submit', function(ev){
    if (ev.target.id!=='editor') return;
    ev.preventDefault();
    var e = readForm();
    if (!/^\d{4}-\d{2}-\d{2}$/.test(e.date)){ ui.editing=e; ui.msg='Add a date.'; render(); return; }
    if (!e.title){ ui.editing=e; ui.msg='Add a headline.'; render(); return; }
    if (!e.countries.length){ ui.editing=e; ui.msg='Pick at least one country.'; render(); return; }
    var entries = STATE.entries.filter(function(x){return x.id!==e.id;}).concat([e]);
    save({ updated: todayISO(), benchmarks: STATE.benchmarks||[], entries: entries });
  });

  var tipEl = null;
  function showTip(row){
    if (!tipEl){ tipEl=document.createElement('div'); tipEl.className='tip'; tipEl.setAttribute('role','tooltip'); document.body.appendChild(tipEl); }
    tipEl.innerHTML = row.getAttribute('data-tip'); tipEl.hidden=false;
    var bar=row.querySelector('.bar').getBoundingClientRect();
    var x=Math.min(bar.right+8, window.innerWidth-tipEl.offsetWidth-12), y=bar.top-tipEl.offsetHeight-8;
    if (y<8) y=bar.bottom+8;
    tipEl.style.left=Math.max(8,x)+'px'; tipEl.style.top=y+'px';
  }
  function hideTip(){ if(tipEl) tipEl.hidden=true; }
  document.addEventListener('mouseover', function(ev){ var r=ev.target.closest&&ev.target.closest('.bar-row'); if(r) showTip(r); else hideTip(); });
  document.addEventListener('focusin', function(ev){ var r=ev.target.closest&&ev.target.closest('.bar-row'); if(r) showTip(r); else hideTip(); });
  document.addEventListener('scroll', hideTip, {passive:true});
  document.addEventListener('click', function(ev){
    var t = ev.target.closest('button'); if (!t) return;
    if (t.hasAttribute('data-goto')){ var id=t.getAttribute('data-goto'); ui.country=''; ui.category=''; ui.q=''; render(); var el=document.getElementById(id); if(el){ el.scrollIntoView({behavior:'smooth',block:'center'}); el.style.borderColor='var(--accent)'; setTimeout(function(){el.style.borderColor='';},1600);} hideTip(); return; }
    if (t.classList.contains('lane')){ var c=t.getAttribute('data-country'); ui.country = ui.country===c ? '' : c; render(); return; }
    if (t.id==='clear-country'){ ui.country=''; render(); return; }
    if (t.id==='add'){ ui.editing={ id:'e'+Date.now().toString(36), date:todayISO(), countries:[], category:CATEGORIES[0], status:'Announced', title:'', summary:'', value:'', valueBn:null, sources:[], note:'' }; ui.msg=''; render(); var f=document.getElementById('f-title'); if(f) f.focus(); return; }
    if (t.id==='cancel'){ ui.editing=null; ui.msg=''; render(); return; }
    var act = t.getAttribute('data-act'), id = t.getAttribute('data-id');
    if (act==='edit'){ var found=STATE.entries.filter(function(x){return x.id===id;})[0]; if(found){ ui.editing=JSON.parse(JSON.stringify(found)); ui.msg=''; render(); window.scrollTo({top:document.getElementById('editor').offsetTop-20,behavior:'smooth'}); } return; }
    if (act==='del'){ ui.confirmDel=id; render(); return; }
    if (act==='del-no'){ ui.confirmDel=null; render(); return; }
    if (act==='del-yes'){ save({ updated: todayISO(), benchmarks: STATE.benchmarks||[], entries: STATE.entries.filter(function(x){return x.id!==id;}) }); return; }
  });

  render();

  if (window.claude && typeof window.claude.use==='function'){
    Promise.all([window.claude.use('artifact'), window.claude.use('user')]).then(function(r){
      artifactNs = r[0]; var user = r[1];
      if (!artifactNs || !user) return;
      return user.canEdit().then(function(ok){ if (ok){ ui.canEdit=true; render(); } });
    }).catch(function(){});
  }
})();
</script>

</body>
</html>
